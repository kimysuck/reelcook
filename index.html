<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF6B2C">
<title>릴쿡 — 릴스를 레시피로</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#FFF8F1; --card:#FFFFFF; --ink:#2B211B; --sub:#7A6A5F; --line:#EFE3D7;
  --acc:#FF6B2C; --acc2:#FFE3D3; --ok:#2E9D6A; --okbg:#E3F5EC; --warn:#C77700; --warnbg:#FFF2D6;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding-bottom:84px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:rgba(255,248,241,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{font-weight:900;font-size:22px;letter-spacing:-.5px}
.logo span{color:var(--acc)}
.pill{font-size:12px;color:var(--sub);background:#fff;border:1px solid var(--line);padding:4px 10px;border-radius:99px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line)}
nav.tabs .wrap{display:flex;height:68px}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--sub)}
nav.tabs button .ic{font-size:22px;line-height:1}
nav.tabs button.on{color:var(--acc);font-weight:700}
h2{font-size:20px;font-weight:900;margin:20px 0 6px;letter-spacing:-.3px}
.muted{color:var(--sub);font-size:14px;line-height:1.55}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
label.fl{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
textarea,input[type=text],input[type=url]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff;font-size:15px;outline:none}
textarea:focus,input:focus{border-color:var(--acc)}
textarea{min-height:140px;resize:vertical;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15px}
.btn.pri{background:var(--acc);color:#fff;width:100%}
.btn.pri:disabled{opacity:.5}
.btn.sec{background:var(--acc2);color:var(--acc)}
.btn.ghost{border:1.5px solid var(--line);background:#fff}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.row{display:flex;gap:8px;align-items:center}
.row.wrapx{flex-wrap:wrap}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs .t{position:relative;width:72px;height:96px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.thumbs .t img{width:100%;height:100%;object-fit:cover}
.thumbs .t button{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;width:22px;height:22px;border-radius:50%;font-size:12px}
.drop{border:1.5px dashed #E2C9B4;border-radius:12px;padding:14px;text-align:center;color:var(--sub);font-size:14px;background:#FFFCF8;display:block;cursor:pointer}
.status{margin-top:12px;font-size:14px;color:var(--sub);white-space:pre-wrap;max-height:120px;overflow:auto}
.err{background:#FFE8E5;color:#B3261E;padding:12px;border-radius:12px;font-size:14px;margin-top:12px}
.note{background:var(--warnbg);color:#7A4C00;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.5}
.note.ok{background:var(--okbg);color:#1D6B47}
.hidden{display:none!important}

/* recipe */
.rhead{padding-top:18px}
.rhead h1{font-size:24px;font-weight:900;letter-spacing:-.5px;line-height:1.3}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.chip.acc{background:var(--acc2);border-color:var(--acc2);color:var(--acc);font-weight:700}
.chip.est{background:var(--warnbg);border-color:var(--warnbg);color:var(--warn)}
.serv{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:14px}
.serv .ctl{display:flex;align-items:center;gap:12px}
.serv .ctl button{width:38px;height:38px;border-radius:12px;background:var(--acc2);color:var(--acc);font-size:20px;font-weight:900}
.serv .ctl b{font-size:20px;min-width:44px;text-align:center}
.seg{display:flex;background:#F3E8DD;border-radius:12px;padding:4px;margin:16px 0 4px;position:sticky;top:60px;z-index:10}
.seg button{flex:1;height:38px;border-radius:9px;font-size:14px;color:var(--sub);font-weight:500}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grp{font-size:13px;font-weight:700;color:var(--acc);margin:16px 0 6px}
.ing{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.ing:last-child{border-bottom:0}
.ing .n{font-weight:700;font-size:15px}
.ing .o{font-size:12px;color:var(--sub);margin-top:3px}
.ing .a{text-align:right;flex-shrink:0}
.ing .a .big{font-weight:900;font-size:17px;color:var(--ink)}
.ing .a .alt{font-size:12px;color:var(--sub);margin-top:2px}
.ing .prep{font-size:12px;color:#5B4A3F;background:#F6EEE6;border-radius:6px;padding:1px 6px;margin-left:4px;font-weight:500}
.step{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .no{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:14px}
.step .tx{font-size:15px;line-height:1.6}
.step .tx b{color:var(--acc)}
.heat{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;margin-right:6px;vertical-align:1px}
.heat.h1{background:#FFF2D6;color:#B36B00}.heat.h2{background:#FFE3D3;color:#D9480F}.heat.h3{background:#FFD6D6;color:#C92A2A}.heat.h0{background:#EEE;color:#666}
.cue{margin-top:8px;font-size:13px;background:var(--okbg);color:#1D6B47;border-radius:10px;padding:8px 10px;line-height:1.5}
.tip{margin-top:6px;font-size:13px;background:#F3F0FF;color:#4C3BA8;border-radius:10px;padding:8px 10px;line-height:1.5}
.mis{margin-top:6px;font-size:13px;background:#FFF0F0;color:#B3261E;border-radius:10px;padding:8px 10px;line-height:1.5}
.timer{margin-top:8px;display:inline-flex;align-items:center;gap:8px;background:#2B211B;color:#fff;border-radius:10px;padding:6px 10px;font-size:14px;font-variant-numeric:tabular-nums}
.timer button{color:#FFB38F;font-weight:700;font-size:13px}
.timer.done{background:var(--ok)}
.nut{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.nut .k{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.nut .k .l{font-size:12px;color:var(--sub)}
.nut .k .v{font-size:20px;font-weight:900;margin-top:2px}
.nut .k .v small{font-size:12px;font-weight:500;color:var(--sub)}
.bar{height:6px;background:#F3E8DD;border-radius:6px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.kcal{grid-column:1/3;background:var(--ink)!important;color:#fff;border:0!important}
.kcal .l{color:#CDBFB5!important}
.shop{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.shop:last-child{border-bottom:0}
.shop input{width:20px;height:20px;accent-color:var(--acc);flex-shrink:0}
.shop .nm{flex:1;font-size:15px}
.shop .nm small{display:block;color:var(--sub);font-size:12px}
.shop.have .nm{color:#B5A69B;text-decoration:line-through}
.shop a{font-size:12px;font-weight:700;text-decoration:none;padding:6px 9px;border-radius:8px;white-space:nowrap}
.shop a.cp{background:#FFE3D3;color:#D9480F}
.shop a.nv{background:#E3F5EC;color:#1D6B47}
.sticky-act{position:fixed;bottom:76px;left:0;right:0;z-index:25;pointer-events:none}
.sticky-act .wrap{display:flex;gap:8px;pointer-events:auto}
.sticky-act .btn{flex:1;box-shadow:0 4px 14px rgba(0,0,0,.12)}

/* list */
.rc{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0;width:100%;text-align:left}
.rc .em{width:52px;height:52px;border-radius:14px;background:var(--acc2);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.rc .t{font-weight:700;font-size:16px}
.rc .s{font-size:12px;color:var(--sub);margin-top:3px}
.empty{text-align:center;padding:48px 16px;color:var(--sub)}
.empty .big{font-size:44px;margin-bottom:8px}

/* feed */
.post{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin:14px 0;overflow:hidden}
.post .ph{width:100%;aspect-ratio:1/1;object-fit:cover;background:#F3E8DD;display:block}
.post .noph{aspect-ratio:2/1;display:flex;align-items:center;justify-content:center;font-size:60px;background:linear-gradient(135deg,#FFE3D3,#FFF2D6)}
.post .bd{padding:12px 14px 14px}
.post .au{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
.post .av{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px}
.post .tt{font-weight:900;font-size:17px;margin-top:8px}
.post .tx{font-size:14px;line-height:1.55;margin-top:4px;white-space:pre-wrap}
.post .acts{display:flex;gap:8px;margin-top:10px;align-items:center}
.like{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);font-size:14px;font-weight:700}
.like.on{border-color:#FFB3B3;background:#FFF0F0;color:#E03131}
.stars{color:#F59F00;letter-spacing:1px}

/* modal & cook mode */
.modal{position:fixed;inset:0;z-index:50;background:rgba(43,33,27,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px 28px}
.sheet h3{font-size:18px;font-weight:900}
.starpick button{font-size:28px;color:#E9DCCF}
.starpick button.on{color:#F59F00}
.cook{position:fixed;inset:0;z-index:60;background:#1E1612;color:#fff;display:flex;flex-direction:column}
.cook .top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.cook .prog{height:4px;background:#3A2E27;margin:0 16px;border-radius:4px;overflow:hidden}
.cook .prog i{display:block;height:100%;background:var(--acc)}
.cook .body{flex:1;overflow:auto;padding:24px 20px;max-width:620px;margin:0 auto;width:100%}
.cook .sn{color:var(--acc);font-weight:900;font-size:15px}
.cook .st{font-size:24px;line-height:1.55;margin-top:10px;font-weight:500}
.cook .st b{color:#FFB38F}
.cook .cue,.cook .tip,.cook .mis{font-size:15px}
.cook .nav{display:flex;gap:10px;padding:14px 16px 22px;max-width:620px;margin:0 auto;width:100%}
.cook .nav .btn{flex:1;height:58px;font-size:17px}
.cook .bigtimer{margin-top:20px;font-size:48px;font-weight:900;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:80;max-width:90vw}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.guide{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.guide div{background:#FFFCF8;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:12px;color:var(--sub)}
.guide b{display:block;font-size:15px;color:var(--ink)}

.banner{background:#2B211B;color:#fff;border-radius:var(--r);padding:14px;margin-top:14px;font-size:14px;line-height:1.55}
.banner a{color:#FFB38F;font-weight:700}
.install{background:var(--acc);color:#fff;border-radius:var(--r);padding:14px;margin-top:14px;display:flex;gap:10px;align-items:center;font-size:14px}
.install .btn{background:#fff;color:var(--acc);height:38px;flex-shrink:0}
.vid{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;font-size:13px}
</style>
</head>

<header class="top"><div class="wrap">
  <div class="logo">릴<span>쿡</span> 🍳</div>
  <button class="pill" id="setBtn">⚙️ 설정</button>
</div></header>

<main class="wrap" id="app"></main>

<nav class="tabs"><div class="wrap">
  <button data-tab="import" class="on"><span class="ic">📥</span>가져오기</button>
  <button data-tab="box"><span class="ic">📒</span>내 레시피</button>
  <button data-tab="feed"><span class="ic">🔥</span>자랑 피드</button>
</div></nav>

<div id="layer"></div>

<script>
/* ================= 저장소 (2단계까지는 이 폰에만 저장) ================= */
const LS = {
  get(k, d){ try{ const v=localStorage.getItem(k); return v==null? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};

/* ================= 상태 ================= */
const S = {
  tab:'import', images:[], caption:'', link:'', fromVideo:false, videoName:'',
  busy:false, status:'', error:'', shareNote:'',
  recipe:null, recipeSavedId:null, servings:2, rtab:'ing', have:{},
  my: LS.get('rc_recipes', []),
  pass: LS.get('rc_pass', '')
};
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ================= 계량 계산 ================= */
const FR = [[0,''],[0.25,'¼'],[1/3,'⅓'],[0.5,'½'],[2/3,'⅔'],[0.75,'¾']];
function frac(x){
  if (x <= 0) return '0';
  let w = Math.floor(x), r = x - w, best = FR[0], bd = 9;
  for (const f of FR.concat([[1,'']])) { const d=Math.abs(r-f[0]); if (d<bd){bd=d;best=f;} }
  if (best[0]===1){ w+=1; best=FR[0]; }
  if (w===0 && !best[1]) return '¼';
  return (w? w : '') + best[1];
}
function roundAmt(v){
  if (v == null || isNaN(v)) return null;
  if (v < 2) return Math.round(v*10)/10;
  if (v < 10) return Math.round(v*2)/2;
  if (v < 100) return Math.round(v);
  if (v < 500) return Math.round(v/5)*5;
  return Math.round(v/10)*10;
}
function spoons(ml){ // 계량스푼 1T=15ml, 1t=5ml / 계량컵 1컵=200ml
  if (ml == null) return '';
  if (ml >= 100) return `계량컵 ${frac(ml/200)}컵 · 종이컵 약 ${frac(ml/180)}컵`;
  if (ml < 1.25) return '1t 미만 (한 꼬집)';
  const half = Math.round(ml/2.5)*2.5;
  const T = Math.floor(half/15), t = (half - T*15)/5, parts=[];
  if (T) parts.push(`${T}T`); if (t) parts.push(`${frac(t)}t`);
  return '계량스푼 ' + parts.join(' + ');
}
function fmt(v,u){ const r=roundAmt(v); return r==null?'':`${r}${u}`; }
function amountOf(ing, f){
  const g = ing.grams!=null ? ing.grams*f : null, ml = ing.ml!=null ? ing.ml*f : null, cnt = ing.count!=null ? ing.count*f : null;
  let big='', alt=[];
  const p = ing.primary || (ml!=null?'ml':(g!=null?'g':'count'));
  if (p==='count' && cnt!=null){ big=`${frac(cnt)}${ing.count_unit||'개'}`; if (g!=null) alt.push(`약 ${fmt(g,'g')}`); }
  else if (p==='ml' && ml!=null){ big=fmt(ml,'ml'); alt.push(spoons(ml)); if (g!=null) alt.push(fmt(g,'g')); }
  else if (g!=null){ big=fmt(g,'g'); if (ml!=null) alt.push(spoons(ml)); if (cnt!=null) alt.push(`${frac(cnt)}${ing.count_unit||'개'}`); }
  else if (cnt!=null) big=`${frac(cnt)}${ing.count_unit||'개'}`;
  else big='적당량';
  return {big, alt:alt.filter(Boolean).join(' · ')};
}

/* ================= 이미지 · 영상 처리 ================= */
async function shrink(blob, max=1024, q=0.82){
  const url = URL.createObjectURL(blob);
  try{
    const img = await new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url;});
    const s = Math.min(1, max/Math.max(img.width,img.height));
    const c = document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',q));
  } finally { URL.revokeObjectURL(url); }
}
// 영상에서 장면 n장을 뽑아 이미지로 (1단계: 소리는 아직 분석 안 함)
async function videoFrames(blob, n=6, max=768){
  const url = URL.createObjectURL(blob);
  const v = document.createElement('video');
  v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = url;
  const wait = (ev, ms=8000) => new Promise((res,rej)=>{ const t=setTimeout(()=>rej(new Error('timeout '+ev)),ms); v.addEventListener(ev,()=>{clearTimeout(t);res();},{once:true}); });
  try{
    await wait('loadeddata', 15000);
    const d = isFinite(v.duration) && v.duration>0 ? v.duration : 30;
    const s = Math.min(1, max/Math.max(v.videoWidth||max, v.videoHeight||max));
    const c = document.createElement('canvas'); c.width=Math.round((v.videoWidth||max)*s); c.height=Math.round((v.videoHeight||max)*s);
    const ctx = c.getContext('2d'), out=[];
    for (let i=0;i<n;i++){
      v.currentTime = Math.min(d-0.1, (i+0.5)/n*d);
      await wait('seeked');
      ctx.drawImage(v,0,0,c.width,c.height);
      out.push(await new Promise(r=>c.toBlob(r,'image/jpeg',0.8)));
    }
    return out;
  } finally { URL.revokeObjectURL(url); v.removeAttribute('src'); v.load(); }
}
function blobToB64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(blob); }); }
async function addImages(blobs){
  for (const b of blobs){ if (S.images.length>=8) break; try{ const s=await shrink(b); S.images.push({blob:s,url:URL.createObjectURL(s)}); }catch(e){} }
}
async function addVideo(blob, name){
  S.status='영상에서 장면을 뽑는 중…'; S.busy=true; render();
  try{
    const frames = await videoFrames(blob, 6);
    S.images.forEach(x=>URL.revokeObjectURL(x.url)); S.images=[];
    for (const f of frames) S.images.push({blob:f,url:URL.createObjectURL(f)});
    S.fromVideo=true; S.videoName=name||'공유받은 영상';
  }catch(e){ S.error='이 영상에서 장면을 뽑지 못했어요. 스크린샷으로 넣어 주세요.'; }
  finally{ S.busy=false; S.status=''; render(); }
}

/* ================= 인스타 공유 받기 ================= */
const URL_RE = /https?:\/\/[^\s]+/i;
async function readShareInbox(){
  if (!('caches' in window)) return;
  try{
    const inbox = await caches.open('share-inbox');
    const metaRes = await inbox.match('/inbox/meta'); if (!metaRes) return;
    const meta = await metaRes.json();
    const all = [meta.title, meta.text, meta.url].filter(Boolean).join('\n');
    const m = all.match(URL_RE);
    if (m) S.link = m[0];
    const rest = all.replace(URL_RE,'').trim();
    if (rest && rest.length > 15) S.caption = rest;
    const imgs=[]; let video=null;
    for (const f of meta.files||[]){ const r=await inbox.match(f.key); if(!r) continue; const b=await r.blob();
      if ((f.type||'').startsWith('video/')) video = video || {b, name:f.name}; else if ((f.type||'').startsWith('image/')) imgs.push(b); }
    for (const k of await inbox.keys()) await inbox.delete(k);
    S.tab='import'; S.recipe=null;
    if (video) await addVideo(video.b, video.name);
    if (imgs.length) await addImages(imgs);
    S.shareNote = video ? 'video' : imgs.length ? 'image' : (m ? 'link' : 'text');
  }catch(e){}
  history.replaceState(null,'','/');
  render();
}

const SAMPLE_CAPTION = `자취생 10분 컷 🔥 대패삼겹 숙주볶음

1. 팬에 대패 올려서 바싹 구워주세요
2. 대파 마늘 넣고 향 내기

function num(v){ if (v===null||v===undefined||v==='') return null; const n=Number(v); return isNaN(n)?null:n; }
function parseJSON(txt){ const a=txt.indexOf('{'), b=txt.lastIndexOf('}'); if(a<0||b<0) throw new Error('JSON 없음'); return JSON.parse(txt.slice(a,b+1)); }
function normalize(r){
  r.ingredients=(r.ingredients||[]).map(i=>({...i, grams:num(i.grams), ml:num(i.ml), count:num(i.count)}));
  r.steps=(r.steps||[]).map(s=>({...s, seconds:num(s.seconds)||0})); r.tools=r.tools||[];
  r.assumptions=(r.assumptions||[]).filter(Boolean); r.beginner_notes=(r.beginner_notes||[]).filter(Boolean);
  r.servings=Math.max(1, Math.round(num(r.servings)||2)); r.nutrition_per_serving=r.nutrition_per_serving||{};
  return r;
}
async function analyze(){
  if (!S.caption.trim() && !S.images.length){ S.error='캡션을 붙여넣거나 사진·영상을 넣어 주세요.'; render(); return; }
  S.busy=true; S.error=''; S.status='AI가 레시피를 읽는 중… (10~30초)'; render();
  try{
    const images=[]; for (const x of S.images) images.push({mime:'image/jpeg', data: await blobToB64(x.blob)});
    const r = await fetch('/api/analyze', { method:'POST',
      headers:{'Content-Type':'application/json', ...(S.pass?{'x-app-passcode':S.pass}:{})},
      body: JSON.stringify({caption:S.caption.trim(), link:S.link.trim(), images, fromVideo:S.fromVideo}) });
    const data = await r.json().catch(()=>({}));
    if (!r.ok){
      const msg = {passcode:'앱 비밀번호가 맞지 않아요. ⚙️ 설정에서 입력해 주세요.', rate_limited:'Gemini 무료 사용량을 잠시 초과했어요. 1분 뒤 다시 시도해 주세요.',
        no_key:'서버에 GEMINI_API_KEY가 설정되지 않았어요. (Vercel 환경변수 확인)', bad_image:'사진 형식이나 크기를 처리하지 못했어요.', empty:'분석할 내용이 없어요.'}[data.error];
      throw new Error(msg || `분석 서버 오류 (${data.error||r.status}${data.message?': '+data.message:''})`);
    }
    const rec = normalize(parseJSON(data.text));
    rec.source = {link:S.link.trim(), caption:S.caption.trim(), model:data.model};
    openRecipe(rec, null);
  }catch(e){ S.error = e.message && !/JSON/.test(e.message) ? e.message : '레시피를 정리하지 못했어요. 캡션을 더 붙여넣고 다시 시도해 보세요.'; }
  finally{ S.busy=false; render(); }
}

/* ---------- 타이머 ---------- */
const T={}; let actx=null;
function beep(){
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    [0,0.35,0.7].forEach(d=>{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.25,actx.currentTime+d); g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d+0.3); o.start(actx.currentTime+d); o.stop(actx.currentTime+d+0.3); }); }catch(e){}
  try{ navigator.vibrate&&navigator.vibrate([300,150,300]); }catch(e){}
}
function toggleTimer(i){
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); actx.resume&&actx.resume(); }catch(e){}
  const s=S.recipe.steps[i]; const t=T[i] ||= {left:s.seconds,run:false,iv:null,done:false};
  if (t.done){ t.left=s.seconds; t.done=false; }
  if (t.run){ clearInterval(t.iv); t.run=false; }
  else { t.run=true; const end=Date.now()+t.left*1000;
    t.iv=setInterval(()=>{ t.left=(end-Date.now())/1000; if(t.left<=0){ t.left=0; t.run=false; t.done=true; clearInterval(t.iv); beep(); toast(`⏰ ${i+1}단계 타이머 끝!`); } refreshTimerUI(); },250); }
  refreshTimerUI();
}
function stopAllTimers(){ Object.values(T).forEach(t=>clearInterval(t.iv)); for(const x in T) delete T[x]; }
function refreshTimerUI(){
  document.querySelectorAll('[data-timer]').forEach(el=>{ const i=+el.dataset.timer, s=S.recipe.steps[i], t=T[i];
    el.classList.toggle('done',!!(t&&t.done)); el.querySelector('.tm').textContent=(t&&t.done)?'✅ 완료':`⏱ ${mmss(t?t.left:s.seconds)}`;
    el.querySelector('button').textContent=t&&t.run?'일시정지':(t&&t.done?'다시':(t&&t.left<s.seconds?'계속':'시작')); });
  const bt=$('#bigTimer'); if(bt){ const i=+bt.dataset.i, t=T[i], s=S.recipe.steps[i]; bt.textContent=t&&t.done?'완료! ✅':mmss(t?t.left:s.seconds); }
}

/* ---------- 쿠킹 모드 ---------- */
let wake=null, cookIdx=0;
async function openCook(i){ cookIdx=i; try{ wake=await navigator.wakeLock.request('screen'); }catch(e){ wake=null; } drawCook(); }
function drawCook(){
  const r=S.recipe, s=r.steps[cookIdx], n=r.steps.length;
  $('#layer').innerHTML=`<div class="cook">
    <div class="top"><b>${esc(r.title)} · ${S.servings}인분</b><button class="btn sm" style="background:#3A2E27;color:#fff" id="cx">닫기 ✕</button></div>
    <div class="prog"><i style="width:${(cookIdx+1)/n*100}%"></i></div>
    <div class="body"><div class="sn">STEP ${cookIdx+1} / ${n} ${s.heat&&s.heat!=='없음'?` · 🔥 ${esc(s.heat)}`:''}</div>
      <div class="st">${stepHTML(s.text)}</div>
      ${s.cue?`<div class="cue" style="margin-top:16px">✅ ${esc(s.cue)}</div>`:''}${s.tip?`<div class="tip">💡 ${esc(s.tip)}</div>`:''}${s.mistake?`<div class="mis">⚠️ ${esc(s.mistake)}</div>`:''}
      ${s.seconds>0?`<div class="bigtimer" id="bigTimer" data-i="${cookIdx}">${mmss(s.seconds)}</div><button class="btn sec" id="ct" style="margin-top:6px">타이머 시작 / 정지</button>`:''}
    </div>
    <div class="nav"><button class="btn" style="background:#3A2E27;color:#fff" id="cp" ${cookIdx===0?'disabled':''}>← 이전</button>
      <button class="btn pri" id="cn">${cookIdx===n-1?'완성! 🎉':'다음 →'}</button></div></div>`;
  $('#cx').onclick=closeCook;
  $('#cp').onclick=()=>{ if(cookIdx>0){cookIdx--; drawCook();} };
  $('#cn').onclick=()=>{ if(cookIdx<n-1){cookIdx++; drawCook();} else { closeCook(); toast('🎉 완성! 자랑 피드는 3단계에서 열려요'); } };
  const ct=$('#ct'); if(ct) ct.onclick=()=>toggleTimer(cookIdx);
  refreshTimerUI();
}
function closeCook(){ $('#layer').innerHTML=''; try{ wake&&wake.release(); }catch(e){} wake=null; render(); }

/* ---------- 내 레시피 (이 폰에 저장) ---------- */
function saveRecipe(){
  if (S.recipeSavedId){ toast('이미 저장된 레시피예요'); return; }
  const id=uid(); S.my.unshift({id, recipe:S.recipe, savedAt:Date.now()});
  if (!LS.set('rc_recipes', S.my)){ S.my.shift(); toast('저장 공간이 부족해요'); return; }
  S.recipeSavedId=id; toast('📒 내 레시피에 저장했어요'); render();
}
function viewBox(){
  if (!S.my.length) return `<h2>내 레시피 📒</h2><div class="empty"><div class="big">🥄</div>아직 저장한 레시피가 없어요.<br>릴스를 가져와 첫 레시피를 만들어 보세요!</div>`;
  return `<h2>내 레시피 📒</h2><p class="muted">${S.my.length}개 · 지금은 이 폰에만 저장돼요 (3단계에서 계정 연동)</p>` + S.my.map(d=>{ const r=d.recipe||{}; return `
    <div class="rc" data-open="${esc(d.id)}" role="button"><div class="em">${esc(r.emoji||'🍳')}</div><div style="flex:1;min-width:0">
    <div class="t">${esc(r.title)}</div><div class="s">⏱ ${esc(r.total_min||'?')}분 · ${esc(r.difficulty||'')} · ${esc(r.servings)}인분 · 재료 ${(r.ingredients||[]).length}개</div></div>
    <button data-del="${esc(d.id)}" style="color:#C9B8AB;font-size:18px;padding:6px">🗑</button></div>`; }).join('');
}
function bindBox(){
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=e=>{ if(e.target.closest('[data-del]')) return;
    const d=S.my.find(x=>x.id===b.dataset.open); if(d) openRecipe(normalize(JSON.parse(JSON.stringify(d.recipe))), d.id); });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); confirmBox('이 레시피를 삭제할까요?', ()=>{ S.my=S.my.filter(x=>x.id!==b.dataset.del); LS.set('rc_recipes',S.my); render(); toast('삭제했어요'); }); });
}
function confirmBox(msg, ok){
  $('#layer').innerHTML=`<div class="modal"><div class="sheet"><h3>${esc(msg)}</h3><div class="row" style="margin-top:16px"><button class="btn ghost" style="flex:1" id="no">취소</button><button class="btn pri" style="flex:1" id="yes">확인</button></div></div></div>`;
  $('#no').onclick=()=>$('#layer').innerHTML=''; $('#yes').onclick=()=>{ $('#layer').innerHTML=''; ok(); };
}
function viewFeed(){
  return `<h2>자랑 피드 🔥</h2><div class="empty"><div class="big">🚧</div><b>3단계에서 열려요</b><br>구글 로그인 + 사진 업로드 + 하트 기능을<br>Supabase로 연결할 예정이에요.</div>`;
}

/* ---------- 설정 ---------- */
$('#setBtn').onclick=()=>{
  $('#layer').innerHTML=`<div class="modal"><div class="sheet"><h3>⚙️ 설정</h3>
    <label class="fl">앱 비밀번호</label>
    <input type="text" id="pw" value="${esc(S.pass)}" placeholder="Vercel에 APP_PASSCODE를 정했다면 입력">
    <p class="muted" style="font-size:12px;margin-top:6px">내 Gemini 사용량을 다른 사람이 쓰지 못하게 막는 비밀번호예요.</p>
    <div class="row" style="margin-top:16px"><button class="btn ghost" style="flex:1" id="pwc">닫기</button><button class="btn pri" style="flex:1" id="pws">저장</button></div>
    <p class="muted" style="font-size:12px;margin-top:16px">릴쿡 v0.1 · 1단계</p></div></div>`;
  $('#pwc').onclick=()=>$('#layer').innerHTML='';
  $('#pws').onclick=()=>{ S.pass=$('#pw').value.trim(); LS.set('rc_pass',S.pass); $('#layer').innerHTML=''; toast('저장했어요'); };
};

/* ================= 시작 ================= */
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{ stopAllTimers(); S.recipe=null; S.tab=b.dataset.tab; window.scrollTo(0,0); render(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
render();
if (new URLSearchParams(location.search).has('share')) readShareInbox();
</script>
</body>
</html>
