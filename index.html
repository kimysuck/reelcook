<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF6B2C">
<title>릴쿡 — 릴스를 레시피로</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8F1; --card:#FFFFFF; --ink:#1F1712; --sub:#6B5B50; --line:#EEDFD2;
  --acc:#F2611D; --accd:#C9480A; --acc2:#FFE6D6; --ok:#1E8A5A; --okbg:#E2F4EA; --warn:#9A5B00; --warnbg:#FFF1D2;
  --r:18px; --fs:17px;
}
html.fs-l{--fs:19px} html.fs-xl{--fs:21px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom));line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:600px;margin:0 auto;padding:0 18px}
.hidden{display:none!important}

/* 상단 · 하단 */
header.top{position:sticky;top:0;z-index:20;background:rgba(255,248,241,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.logo{font-weight:900;font-size:1.35rem;letter-spacing:-.5px}
.logo span{color:var(--acc)}
.pill{font-size:.85rem;color:var(--sub);background:#fff;border:1px solid var(--line);padding:6px 12px;border-radius:99px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:flex;height:70px}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.8rem;color:var(--sub)}
nav.tabs button .ic{font-size:1.5rem;line-height:1}
nav.tabs button.on{color:var(--acc);font-weight:700}

/* 공통 */
h2{font-size:1.4rem;font-weight:900;margin:22px 0 6px;letter-spacing:-.3px}
.muted{color:var(--sub);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:14px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:16px;font-weight:700;font-size:1rem}
.btn.pri{background:var(--acc);color:#fff;width:100%}
.btn.pri:disabled{opacity:.5}
.btn.sec{background:var(--acc2);color:var(--accd)}
.btn.ghost{border:1.5px solid var(--line);background:#fff}
.btn.sm{min-height:40px;padding:0 14px;font-size:.88rem;border-radius:12px}
.row{display:flex;gap:10px;align-items:center}
label.fl{display:block;font-weight:700;font-size:.95rem;margin:16px 0 8px}
textarea,input[type=text],input[type=url]{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:14px;background:#fff;font-size:1rem;outline:none}
textarea:focus,input:focus{border-color:var(--acc)}
textarea{min-height:140px;resize:vertical}
.drop{border:1.5px dashed #E2C9B4;border-radius:14px;padding:16px;text-align:center;color:var(--sub);font-size:.92rem;background:#FFFCF8;display:block;cursor:pointer}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs .t{position:relative;width:72px;height:96px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.thumbs .t img{width:100%;height:100%;object-fit:cover}
.thumbs .t button{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;width:24px;height:24px;border-radius:50%;font-size:12px}
.err{background:#FFE8E5;color:#A3231A;padding:14px 16px;border-radius:14px;font-size:.95rem;margin-top:14px}
.note{background:var(--warnbg);color:#6E4300;padding:12px 14px;border-radius:14px;font-size:.9rem}
.note.ok{background:var(--okbg);color:#155C3C}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:.92rem;z-index:80;max-width:90vw}
.spin{width:20px;height:20px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
.spin.dk{border-color:#F3E8DD;border-top-color:var(--acc);width:34px;height:34px}
@keyframes sp{to{transform:rotate(360deg)}}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.banner{background:var(--ink);color:#fff;border-radius:var(--r);padding:16px;margin-top:16px;font-size:.92rem}
.banner a{color:#FFB38F;font-weight:700}
.install{background:var(--acc);color:#fff;border-radius:var(--r);padding:14px 16px;margin-top:16px;display:flex;gap:10px;align-items:center;font-size:.92rem}
.install .btn{background:#fff;color:var(--accd);min-height:40px;flex-shrink:0}

/* 진행 상황 */
.prog-card{text-align:center;padding:26px 18px}
.prog-title{font-size:1.1rem;font-weight:900;margin-top:12px}
.prog-time{color:var(--sub);font-size:.88rem;margin-top:2px}
.checks{text-align:left;margin:16px auto 0;max-width:340px;font-size:.95rem}
.checks div{padding:4px 0}
.cap-peek{text-align:left;margin-top:14px;background:#FFFCF8;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:.85rem;color:var(--sub);max-height:120px;overflow:hidden;white-space:pre-wrap}

/* 레시피 */
.rhead{padding-top:16px}
.rhead h1{font-size:1.6rem;font-weight:900;letter-spacing:-.5px;line-height:1.35;margin-top:14px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{font-size:.82rem;padding:5px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.chip.acc{background:var(--acc2);border-color:var(--acc2);color:var(--accd);font-weight:700}
.chip.warn{background:var(--warnbg);border-color:var(--warnbg);color:var(--warn)}
.serv{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:16px}
.serv .ctl{display:flex;align-items:center;gap:14px}
.serv .ctl button{width:44px;height:44px;border-radius:14px;background:var(--acc2);color:var(--accd);font-size:1.4rem;font-weight:900}
.serv .ctl b{font-size:1.5rem;min-width:36px;text-align:center}
.seg{display:flex;background:#F2E6DA;border-radius:14px;padding:4px;margin:18px 0 6px;position:sticky;top:62px;z-index:10}
.seg button{flex:1;min-height:44px;border-radius:11px;font-size:.98rem;color:var(--sub);font-weight:500}
.seg button.on{background:#fff;color:var(--ink);font-weight:900;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.unitsw{display:flex;gap:6px;margin:14px 0 4px}
.unitsw button{flex:1;min-height:40px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:.86rem;color:var(--sub)}
.unitsw button.on{border-color:var(--acc);color:var(--accd);font-weight:900;background:#FFF4EC}
.grp{font-size:.92rem;font-weight:900;color:var(--accd);margin:20px 4px 8px}
.ing{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.ing:last-child{border-bottom:0}
.ing .n{font-weight:700;font-size:1.05rem;line-height:1.4}
.ing .prep{display:inline-block;font-size:.78rem;color:#5B4A3F;background:#F4EBE2;border-radius:6px;padding:1px 7px;margin-left:6px;font-weight:500;vertical-align:2px}
.ing .o{font-size:.82rem;color:var(--sub);margin-top:2px}
.ing .a{text-align:right;flex-shrink:0;max-width:48%}
.ing .big{font-weight:900;font-size:1.25rem;color:var(--ink);line-height:1.3}
.ing .alt{font-size:.8rem;color:var(--sub)}
.est{color:var(--warn);font-size:.75rem;font-weight:700}
.ratio{background:var(--ink);color:#fff;border-radius:var(--r);padding:18px;margin-top:14px}
.ratio .ttl{font-size:.85rem;color:#E9D8CB;font-weight:700}
.ratio .rv{font-size:1.25rem;font-weight:900;margin-top:6px;line-height:1.6}
.ratio .rv b{color:#FFB38F}
.ratio .sm{font-size:.8rem;color:#CDBFB5;margin-top:8px}
.stepc{display:flex;gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}
.stepc:last-child{border-bottom:0}
.no{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:var(--acc);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:1rem}
.stx{font-size:1.1rem;line-height:1.7}
.stx b{color:var(--accd)}
.heat{display:inline-block;font-size:.8rem;font-weight:900;padding:2px 9px;border-radius:7px;margin-bottom:4px}
.heat.h1{background:#FFF1D2;color:#9A5B00}.heat.h2{background:#FFE3D3;color:#C2410C}.heat.h3{background:#FFD9D9;color:#B91C1C}.heat.h0{background:#EEE;color:#555}
.cue,.tip,.mis{margin-top:10px;font-size:.92rem;border-radius:12px;padding:10px 12px;line-height:1.55}
.cue{background:var(--okbg);color:#155C3C}
.tip{background:#F1EEFF;color:#4334A0}
.mis{background:#FFF0F0;color:#A3231A}
.timer{margin-top:10px;display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:12px;padding:8px 14px;font-size:1rem;font-variant-numeric:tabular-nums}
.timer button{color:#FFB38F;font-weight:900}
.timer.done{background:var(--ok)}
.nut{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.nut .k{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.nut .k .l{font-size:.82rem;color:var(--sub)}
.nut .k .v{font-size:1.4rem;font-weight:900}
.nut .k .v small{font-size:.8rem;font-weight:500;color:var(--sub)}
.bar{height:7px;background:#F2E6DA;border-radius:6px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.kcal{grid-column:1/3;background:var(--ink)!important;color:#fff;border:0!important}
.kcal .l{color:#CDBFB5!important}
.shop{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.shop:last-child{border-bottom:0}
.shop input{width:22px;height:22px;accent-color:var(--acc);flex-shrink:0}
.shop .nm{flex:1;font-size:1.02rem;font-weight:700;line-height:1.4}
.shop .nm small{display:block;color:var(--sub);font-size:.8rem;font-weight:500}
.shop.have .nm{color:#B5A69B;text-decoration:line-through}
.shop a{font-size:.8rem;font-weight:900;text-decoration:none;padding:8px 10px;border-radius:10px;white-space:nowrap}
.shop a.cp{background:#FFE3D3;color:#C2410C}
.shop a.nv{background:#E2F4EA;color:#155C3C}
.sticky-act{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom));left:0;right:0;z-index:25;pointer-events:none}
.sticky-act .wrap{display:flex;gap:10px;pointer-events:auto}
.sticky-act .btn{flex:1;box-shadow:0 4px 14px rgba(0,0,0,.12)}

/* 목록 */
.rc{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;cursor:pointer}
.rc .em{width:54px;height:54px;border-radius:16px;background:var(--acc2);display:flex;align-items:center;justify-content:center;font-size:1.7rem;flex-shrink:0}
.rc .t{font-weight:900;font-size:1.05rem}
.rc .s{font-size:.82rem;color:var(--sub);margin-top:2px}
.empty{text-align:center;padding:52px 16px;color:var(--sub)}
.empty .big{font-size:3rem;margin-bottom:8px}

/* 시트 · 쿠킹 모드 */
.modal{position:fixed;inset:0;z-index:50;background:rgba(31,23,18,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(28px + env(safe-area-inset-bottom))}
.sheet h3{font-size:1.2rem;font-weight:900}
.opt{display:flex;gap:6px;margin-top:8px}
.opt button{flex:1;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff}
.opt button.on{border-color:var(--acc);color:var(--accd);font-weight:900}
.cook{position:fixed;inset:0;z-index:60;background:#1A130F;color:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.cook .top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-size:.95rem}
.cook .prog{height:5px;background:#3A2E27;margin:0 18px;border-radius:4px;overflow:hidden}
.cook .prog i{display:block;height:100%;background:var(--acc)}
.cook .body{flex:1;overflow:auto;padding:26px 22px;max-width:640px;margin:0 auto;width:100%}
.cook .sn{color:#FF9A66;font-weight:900;font-size:1rem}
.cook .st{font-size:1.6rem;line-height:1.6;margin-top:12px;font-weight:500}
.cook .st b{color:#FFB38F}
.cook .cue,.cook .tip,.cook .mis{font-size:1.05rem}
.cook .nav{display:flex;gap:12px;padding:14px 18px calc(22px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;width:100%}
.cook .nav .btn{flex:1;min-height:64px;font-size:1.15rem}
.bigtimer{margin-top:22px;font-size:3.2rem;font-weight:900;font-variant-numeric:tabular-nums}
.awake{font-size:.8rem;color:#8F7F73;margin-top:22px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="logo">릴<span>쿡</span> 🍳</div>
  <button class="pill" id="setBtn">⚙️ 설정</button>
</div></header>

<main class="wrap" id="app"></main>

<nav class="tabs"><div class="wrap">
  <button data-tab="import" class="on"><span class="ic">📥</span>가져오기</button>
  <button data-tab="box"><span class="ic">📒</span>내 레시피</button>
  <button data-tab="feed"><span class="ic">🔥</span>자랑 피드</button>
</div></nav>

<div id="layer"></div>

<script>
const VERSION = 'v0.6';
/* ================= 저장소 (계정 연동 전까지는 이 폰에만 저장) ================= */
const LS = {
  get(k, d){ try{ const v=localStorage.getItem(k); return v==null? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};

/* ================= 상태 ================= */
const S = {
  tab:'import', images:[], caption:'', link:'', fromVideo:false, videoName:'',
  busy:false, phase:'', t0:0, fetched:null, error:'', shareNote:'',
  recipe:null, recipeSavedId:null, servings:2, rtab:'ing', have:{},
  my: LS.get('rc_recipes', []),
  pass: LS.get('rc_pass', ''),
  unit: LS.get('rc_unit', 'orig'),   // orig = 영상 단위(비율) / precise = g·ml
  fs: LS.get('rc_fs', 'm'),
  cooking:false
};
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function applyFs(){ document.documentElement.classList.toggle('fs-l', S.fs==='l'); document.documentElement.classList.toggle('fs-xl', S.fs==='xl'); }
applyFs();

/* ================= 화면 꺼짐 방지 ================= */
let wakeLock=null, wakeWanted=false;
async function setAwake(on){
  wakeWanted=on;
  try{
    if (on && !wakeLock && 'wakeLock' in navigator && document.visibilityState==='visible'){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', ()=>{ wakeLock=null; });
    } else if (!on && wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){ wakeLock=null; }
}
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible' && wakeWanted) setAwake(true); });
const awakeSupported = 'wakeLock' in navigator;

/* ================= 분량 계산 ================= */
const FR = [[0,''],[0.25,'¼'],[1/3,'⅓'],[0.5,'½'],[2/3,'⅔'],[0.75,'¾']];
function frac(x){
  if (x == null || isNaN(x)) return '';
  if (x <= 0) return '0';
  if (x >= 10) return String(Math.round(x));
  let w = Math.floor(x), r = x - w, best = FR[0], bd = 9;
  for (const f of FR.concat([[1,'']])) { const d=Math.abs(r-f[0]); if (d<bd){bd=d;best=f;} }
  if (best[0]===1){ w+=1; best=FR[0]; }
  if (w===0 && !best[1]) return '¼';
  return (w? w : '') + best[1];
}
function roundAmt(v){
  if (v == null || isNaN(v)) return null;
  if (v < 2) return Math.round(v*10)/10;
  if (v < 10) return Math.round(v*2)/2;
  if (v < 100) return Math.round(v);
  if (v < 500) return Math.round(v/5)*5;
  return Math.round(v/10)*10;
}
function fmt(v,u){ const r=roundAmt(v); return r==null?'':`${r}${u}`; }
function spoons(ml){
  if (ml == null) return '';
  if (ml >= 100) return `종이컵 약 ${frac(ml/180)}컵`;
  if (ml < 1.25) return '';
  const half=Math.round(ml/2.5)*2.5, T=Math.floor(half/15), t=(half-T*15)/5, p=[];
  if (T) p.push(`${T}큰술`); if (t) p.push(`${frac(t)}작은술`);
  return '계량스푼 '+p.join(' ');
}
function precise(ing, f){
  const g=ing.grams!=null?ing.grams*f:null, ml=ing.ml!=null?ing.ml*f:null, cnt=ing.count!=null?ing.count*f:null;
  const p=ing.primary || (ml!=null?'ml':(g!=null?'g':'count'));
  if (p==='count' && cnt!=null) return {big:`${frac(cnt)}${ing.count_unit||'개'}`, alt: g!=null?`약 ${fmt(g,'g')}`:''};
  if (p==='ml' && ml!=null) return {big:fmt(ml,'ml'), alt:spoons(ml)};
  if (g!=null) return {big:fmt(g,'g'), alt: ml!=null?spoons(ml):''};
  if (cnt!=null) return {big:`${frac(cnt)}${ing.count_unit||'개'}`, alt:''};
  return {big:'적당량', alt:''};
}
const VAGUE = /^(약간|적당히|적당량|톡톡|조금|기호껏|취향껏)$/;
function original(ing, f){
  const u=(ing.orig_unit||'').trim();
  if (u && VAGUE.test(u)) return {big:'약간', alt:'맛보며 기호껏'};
  if (ing.orig_qty!=null && u) return {big:`${frac(ing.orig_qty*f)}${/^[a-z]+$/i.test(u)?'':' '}${u}`, alt:''};
  return null;
}
function amountOf(ing, f){
  const pr=precise(ing,f);
  if (S.unit==='orig'){
    const o=original(ing,f);
    if (o) return {big:o.big, alt: o.alt || (pr.big!=='적당량' ? `≈ ${pr.big}` : '')};
  }
  return pr;
}
// 양념 비율: 같은 숟가락만 쓰면 크기와 상관없이 간이 맞는다
const SPOON = /^(숟갈|숟가락|밥숟가락|밥숟갈|큰술|스푼|T|tbsp|수저)$/i;
function sauceRatio(r, f){
  const list=r.ingredients.filter(i=>i.orig_qty!=null && SPOON.test((i.orig_unit||'').trim()));
  if (list.length<2) return null;
  return list.map(i=>`${esc(i.name)} <b>${esc(frac(i.orig_qty*f))}</b>`).join(' : ');
}

/* ================= 이미지 · 영상 처리 ================= */
async function shrink(blob, max=1024, q=0.82){
  const url=URL.createObjectURL(blob);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url;});
    const s=Math.min(1, max/Math.max(img.width,img.height));
    const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',q));

async function videoFrames(blob, n=8, max=768){
  const url=URL.createObjectURL(blob), v=document.createElement('video');
  v.muted=true; v.playsInline=true; v.preload='auto'; v.src=url;
  const wait=(ev,ms=8000)=>new Promise((res,rej)=>{ const t=setTimeout(()=>rej(new Error('timeout '+ev)),ms); v.addEventListener(ev,()=>{clearTimeout(t);res();},{once:true}); });
  try{
    await wait('loadeddata',15000);
    const d=isFinite(v.duration)&&v.duration>0?v.duration:30;
    const s=Math.min(1, max/Math.max(v.videoWidth||max, v.videoHeight||max));
    const c=document.createElement('canvas'); c.width=Math.round((v.videoWidth||max)*s); c.height=Math.round((v.videoHeight||max)*s);
    const ctx=c.getContext('2d'), out=[];
    for (let i=0;i<n;i++){ v.currentTime=Math.min(d-0.1,(i+0.5)/n*d); await wait('seeked'); ctx.drawImage(v,0,0,c.width,c.height); out.push(await new Promise(r=>c.toBlob(r,'image/jpeg',0.8))); }
    return out;
  } finally { URL.revokeObjectURL(url); v.removeAttribute('src'); v.load(); }
}
function blobToB64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(blob); }); }

async function addVideo(blob, name){

    S.images.forEach(x=>URL.revokeObjectURL(x.url)); S.images=[];

}

const URL_RE=/https?:\/\/[^\s]+/i;
async function readShareInbox(){
  if (!('caches' in window)) return;
  let started=false;
  try{
    const inbox=await caches.open('share-inbox');
    const metaRes=await inbox.match('/inbox/meta'); if (!metaRes) return;
    const meta=await metaRes.json();
    const all=[meta.title, meta.text, meta.url].filter(Boolean).join('\n');
    const m=all.match(URL_RE);
    resetInput(); if (m) S.link=m[0];
    const rest=all.replace(URL_RE,'').trim(); if (rest.length>15) S.caption=rest;
    const imgs=[]; let video=null;
    for (const f of meta.files||[]){ const r=await inbox.match(f.key); if(!r) continue; const b=await r.blob();
      if ((f.type||'').startsWith('video/')) video=video||{b,name:f.name}; else if ((f.type||'').startsWith('image/')) imgs.push(b); }
    for (const k of await inbox.keys()) await inbox.delete(k);
    S.tab='import'; S.recipe=null;
    history.replaceState(null,'','/');
    if (video){ S.busy=true; S.phase='frames'; S.t0=Date.now(); render(); await addVideo(video.b, video.name); S.busy=false; }
    if (imgs.length) await addImages(imgs);
    if (m || video || imgs.length || S.caption){ started=true; analyze(); }
  }catch(e){}
  if (!started){ history.replaceState(null,'','/'); render(); }
}

const ERR = {

async function streamAnalyze(body, onEvent){
  const r=await fetch('/api/analyze',{ method:'POST', headers:{'Content-Type':'application/json', ...(S.pass?{'x-app-passcode':S.pass}:{})}, body:JSON.stringify({...body, stream:true}) });
  if (!r.ok || !r.body || !(r.headers.get('content-type')||'').includes('ndjson')){
    const data=await r.json().catch(()=>({})); return { status:r.status, ...data };
  }
  const reader=r.body.getReader(), dec=new TextDecoder(); let buf='', final=null;
  while(true){
    const {value, done}=await reader.read(); if (done) break;
    buf+=dec.decode(value,{stream:true}); let i;
    while((i=buf.indexOf('\n'))>=0){ const line=buf.slice(0,i).trim(); buf=buf.slice(i+1); if(!line) continue;
      let ev; try{ ev=JSON.parse(line); }catch(e){ continue; }
      if (ev.done) final=ev; else onEvent(ev); }
  }
  if (!final) throw new Error('__cut');
  return final;
}
async function analyze(){

  S.phase = igLink && !S.images.length ? 'fetch' : 'analyze'; render();
  clearInterval(tick); tick=setInterval(()=>{ const el=$('#elapsed'); if(el) el.textContent=`${Math.round((Date.now()-S.t0)/1000)}초`; },1000);
  try{
    const body={caption:S.caption.trim(), link:S.link.trim(), fromVideo:S.fromVideo};
    if (S.images.length){ body.images=[]; for (const x of S.images) body.images.push({mime:'image/jpeg', data: await blobToB64(x.blob)}); }
    const data=await streamAnalyze(body, ev=>{

      else if (ev.stage==='fetched'){ S.fetched={caption:ev.caption, comments:ev.comments, videoUrl:ev.videoUrl, duration:ev.duration}; render(); }

      else if (ev.stage==='busy'){ S.note2='AI 서버가 붐벼서 다시 시도하는 중…'; render(); }
      else if (ev.stage==='retry'){ S.note2='첫 결과가 부족해서 더 꼼꼼하게 다시 보는 중…'; render(); }
    });
    if (data.error || (data.status && data.status!==200)){

      throw new Error(ERR[data.error] || `분석 서버 오류 (${data.error||data.status}${data.message?': '+data.message:''})`);
    }

    const src=data.source||{};

}

  let body='';
  if (S.rtab==='ing'){
    const groups={}; r.ingredients.forEach(i=>{ (groups[i.group||'재료'] ||= []).push(i); });
    const ratio = S.unit==='orig' ? sauceRatio(r,k()) : null;
    body = (hasOrig?`<div class="unitsw"><button data-unit="orig" class="${S.unit==='orig'?'on':''}">🥄 영상 단위 (비율)</button><button data-unit="precise" class="${S.unit==='precise'?'on':''}">⚖️ 정밀 (g·ml)</button></div>`:'')
    + (ratio?`<div class="ratio"><div class="ttl">🥄 양념 비율 (숟가락 기준)</div><div class="rv">${ratio}</div><div class="sm">숟가락 크기는 상관없어요. <b>같은 숟가락 하나로만</b> 계량하면 간이 맞아요.</div></div>`:'')
    + Object.entries(groups).map(([g,list])=>`<div class="grp">${esc(g)}</div><div class="card" style="margin:0;padding:2px 18px">${
      list.map(i=>{ const a=amountOf(i,k()); return `<div class="ing"><div><div class="n">${esc(i.name)}${i.prep?`<span class="prep">${esc(i.prep)}</span>`:''}</div>
      ${i.estimated?'<div class="est">영상 보고 추정한 양</div>':''}</div>
      <div class="a"><div class="big">${esc(a.big)}</div>${a.alt?`<div class="alt">${esc(a.alt)}</div>`:''}</div></div>`; }).join('')}</div>`).join('')
    + (r.beginner_notes.length?`<div class="card"><b>🔰 시작 전에</b><ul style="margin:8px 0 0 20px;font-size:.95rem">${r.beginner_notes.map(n=>`<li style="margin:4px 0">${esc(n)}</li>`).join('')}</ul></div>`:'');
  }
  if (S.rtab==='step'){
    body = `<div class="card" style="padding:2px 18px">${r.steps.map((s,i)=>`<div class="stepc"><div class="no">${i+1}</div><div style="flex:1;min-width:0">
      ${s.heat&&s.heat!=='없음'?`<span class="heat ${heatCls(s.heat)}">🔥 ${esc(s.heat)}</span>`:''}
      <div class="stx">${stepHTML(s.text)}</div>
      ${s.cue?`<div class="cue">✅ ${esc(s.cue)}</div>`:''}
      ${s.tip?`<div class="tip">💡 ${esc(s.tip)}</div>`:''}
      ${s.mistake?`<div class="mis">⚠️ ${esc(s.mistake)}</div>`:''}
      ${s.seconds>0?`<div class="timer" data-timer="${i}"><span class="tm">⏱ ${mmss(s.seconds)}</span><button data-tstart="${i}">시작</button></div>`:''}
    </div></div>`).join('')}</div>`;
  }
  if (S.rtab==='nut'){
    const n=r.nutrition_per_serving, D={carb_g:324,protein_g:55,fat_g:54,sugar_g:100,sodium_mg:2000};
    const cell=(key,l,u)=>{ const v=num(n[key]); const p=v==null?0:Math.min(100,Math.round(v/D[key]*100)); return `<div class="k"><div class="l">${l}</div><div class="v">${v==null?'-':Math.round(v)}<small> ${u}</small></div><div class="bar"><i style="width:${p}%"></i></div><div class="l" style="margin-top:4px">하루 기준의 ${p}%</div></div>`; };
    body=`<div class="nut"><div class="k kcal"><div class="l">1인분 열량</div><div class="v" style="font-size:2rem">${num(n.kcal)==null?'-':Math.round(n.kcal)}<small style="color:#CDBFB5"> kcal</small></div></div>
      ${cell('carb_g','탄수화물','g')}${cell('protein_g','단백질','g')}${cell('fat_g','지방','g')}${cell('sugar_g','당류','g')}${cell('sodium_mg','나트륨','mg')}</div>
      <p class="muted" style="font-size:.8rem;margin-top:12px">AI가 일반적인 식품 성분값으로 추정한 값이에요. 하루 기준은 식약처 영양성분 기준치(성인)예요.</p>`;
  }
  if (S.rtab==='shop'){
    const cp=q=>`https://www.coupang.com/np/search?q=${encodeURIComponent(q)}`, nv=q=>`https://search.shopping.naver.com/search/all?query=${encodeURIComponent(q)}`;
    const items=r.ingredients.map((i,idx)=>({i,idx})).filter(({i})=> i.buy===true || (i.buy==null && !BASIC.test((i.name||'').trim())) || (i.brand||'').trim());
    const line=(key,name,sub,q)=>`<div class="shop ${S.have[key]?'have':''}"><input type="checkbox" data-have="${esc(key)}" ${S.have[key]?'checked':''}><div class="nm">${esc(name)}${sub?`<small>${esc(sub)}</small>`:''}</div>
      <a class="cp" href="${cp(q)}" target="_blank" rel="noopener">쿠팡</a><a class="nv" href="${nv(q)}" target="_blank" rel="noopener">네이버</a></div>`;
    const need=items.filter(({idx})=>!S.have['i'+idx]).length;
    body = items.length ? `<div class="note ok" style="margin-top:14px">기본 양념(소금·간장·설탕 등)은 뺐어요. 집에 있으면 체크하세요 — 남은 것 <b>${need}개</b></div>
      <div class="card" style="padding:2px 18px">${items.map(({i,idx})=>line('i'+idx, i.brand?`${i.name}`:i.name, [i.brand?`🏷 ${i.brand}`:'', amountOf(i,k()).big].filter(Boolean).join(' · '), i.buy_keyword||i.brand||i.name)).join('')}</div>`
      : `<div class="empty" style="padding:30px 10px"><div class="big">🧂</div>특별히 살 재료가 없어요. 집에 있는 재료로 충분해요!</div>`;
    if (r.tools.length) body += `<div class="grp">🍳 있으면 좋은 도구</div><div class="card" style="padding:2px 18px">${r.tools.map((t,idx)=>line('t'+idx,t.name,'',t.buy_keyword||t.name)).join('')}</div>`;
    if (items.length) body += `<div class="row" style="margin-top:14px"><button class="btn ghost sm" id="copyList">📋 장보기 목록 복사</button></div>`;
  }
  const src=r.source||{};
  const conf = r.confidence==='low'?'<span class="chip warn">정확도 낮음 · 추정 많음</span>':r.confidence==='medium'?'<span class="chip warn">일부 추정</span>':'';
  return `<div class="rhead">
    <button class="btn ghost sm" id="back">← 뒤로</button>
    <h1>${esc(r.emoji||'🍳')} ${esc(r.title)}</h1>
    ${r.summary?`<p class="muted" style="margin-top:4px">${esc(r.summary)}</p>`:''}
    <div class="meta"><span class="chip acc">⏱ ${esc(r.total_min||'?')}분</span><span class="chip">${esc(r.difficulty||'')}</span>${conf}
      ${src.gotVideo?`<span class="chip">${src.visualOnly?'🎬 화면 분석':'🎬 영상+캡션'}</span>`:''}</div>
    ${r.assumptions.length&&r.confidence!=='high'?`<div class="note" style="margin-top:12px">🤔 ${r.assumptions.map(esc).join(' / ')}</div>`:''}
    ${src.caption||(src.comments&&src.comments.length)||src.link?`<details class="card" style="padding:14px 16px;margin-top:12px"><summary class="muted"><b>📝 원본 보기</b> (읽은 캡션·댓글)</summary>
      ${src.caption?`<div style="white-space:pre-wrap;font-size:.88rem;margin-top:10px">${esc(src.caption)}</div>`:''}
      ${(src.comments||[]).map(c=>`<div style="white-space:pre-wrap;font-size:.85rem;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">💬 ${esc(c)}</div>`).join('')}
      ${src.link?`<p style="margin-top:10px;font-size:.85rem"><a href="${esc(src.link)}" target="_blank" rel="noopener">인스타에서 보기 ↗</a></p>`:''}</details>`:''}
  </div>
  <div class="serv"><div><b>몇 인분?</b><div class="muted" style="font-size:.8rem">원래 ${r.servings}인분 · 모든 양 자동 계산</div></div>
    <div class="ctl"><button id="sm" aria-label="줄이기">−</button><b>${S.servings}</b><button id="sp" aria-label="늘리기">+</button></div></div>
  <div class="seg">${tabs.map(([t,l])=>`<button data-rt="${t}" class="${S.rtab===t?'on':''}">${l}</button>`).join('')}</div>
  ${body}
  <div style="height:90px"></div>
  <div class="sticky-act"><div class="wrap">
    <button class="btn sec" id="save">${S.recipeSavedId?'✓ 저장됨':'📒 저장'}</button>
    <button class="btn pri" id="cookBtn" style="flex:1.7">👩‍🍳 요리 시작</button>
  </div></div>`;
}
function bindRecipe(){
  $('#back').onclick=()=>{ stopAllTimers(); S.recipe=null; render(); };
  $('#sm').onclick=()=>{ if(S.servings>1){S.servings--; render();} };
  $('#sp').onclick=()=>{ if(S.servings<12){S.servings++; render();} };
  document.querySelectorAll('[data-rt]').forEach(b=>b.onclick=()=>{ S.rtab=b.dataset.rt; render(); });
  document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{ S.unit=b.dataset.unit; LS.set('rc_unit',S.unit); render(); });
  document.querySelectorAll('[data-have]').forEach(c=>c.onchange=()=>{ S.have[c.dataset.have]=c.checked; render(); });
  document.querySelectorAll('[data-tstart]').forEach(b=>b.onclick=()=>toggleTimer(+b.dataset.tstart));
  refreshTimerUI();
  const cl=$('#copyList'); if(cl) cl.onclick=async()=>{
    const r=S.recipe, lines=r.ingredients.map((i,idx)=>({i,idx})).filter(({i,idx})=>!S.have['i'+idx] && (i.buy===true||(i.buy==null&&!BASIC.test(i.name))||i.brand)).map(({i})=>`- ${i.brand||i.name} ${amountOf(i,k()).big}`);
    try{ await navigator.clipboard.writeText(`[${r.title} ${S.servings}인분 장보기]\n`+lines.join('\n')); toast('장보기 목록을 복사했어요'); }catch(e){ toast('복사하지 못했어요'); }
  };
  $('#save').onclick=saveRecipe;
  $('#cookBtn').onclick=()=>openCook(0);
}

/* ---------- 타이머 ---------- */
const T={}; let actx=null;
function beep(){
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    [0,0.35,0.7].forEach(d=>{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.25,actx.currentTime+d); g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d+0.3); o.start(actx.currentTime+d); o.stop(actx.currentTime+d+0.3); }); }catch(e){}
  try{ navigator.vibrate&&navigator.vibrate([300,150,300]); }catch(e){}
}
function toggleTimer(i){
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); actx.resume&&actx.resume(); }catch(e){}
  const s=S.recipe.steps[i], t=T[i] ||= {left:s.seconds,run:false,iv:null,done:false};
  if (t.done){ t.left=s.seconds; t.done=false; }
  if (t.run){ clearInterval(t.iv); t.run=false; }
  else { t.run=true; const end=Date.now()+t.left*1000;
    t.iv=setInterval(()=>{ t.left=(end-Date.now())/1000; if(t.left<=0){ t.left=0; t.run=false; t.done=true; clearInterval(t.iv); beep(); toast(`⏰ ${i+1}단계 타이머 끝!`); } refreshTimerUI(); },250); }
  refreshTimerUI();
}
function stopAllTimers(){ Object.values(T).forEach(t=>clearInterval(t.iv)); for(const x in T) delete T[x]; }
function refreshTimerUI(){
  document.querySelectorAll('[data-timer]').forEach(el=>{ const i=+el.dataset.timer, s=S.recipe.steps[i], t=T[i];
    el.classList.toggle('done',!!(t&&t.done)); el.querySelector('.tm').textContent=(t&&t.done)?'✅ 완료':`⏱ ${mmss(t?t.left:s.seconds)}`;
    el.querySelector('button').textContent=t&&t.run?'일시정지':(t&&t.done?'다시':(t&&t.left<s.seconds?'계속':'시작')); });
  const bt=$('#bigTimer'); if(bt){ const i=+bt.dataset.i, t=T[i], s=S.recipe.steps[i]; bt.textContent=t&&t.done?'완료! ✅':mmss(t?t.left:s.seconds); }
}

/* ---------- 쿠킹 모드 ---------- */
let cookIdx=0;
function openCook(i){ cookIdx=i; S.cooking=true; setAwake(true); drawCook(); }
function drawCook(){
  const r=S.recipe, s=r.steps[cookIdx], n=r.steps.length;
  $('#layer').innerHTML=`<div class="cook">
    <div class="top"><b>${esc(r.title)} · ${S.servings}인분</b><button class="btn sm" style="background:#3A2E27;color:#fff" id="cx">닫기 ✕</button></div>
    <div class="prog"><i style="width:${(cookIdx+1)/n*100}%"></i></div>
    <div class="body"><div class="sn">STEP ${cookIdx+1} / ${n} ${s.heat&&s.heat!=='없음'?` · 🔥 ${esc(s.heat)}`:''}</div>
      <div class="st">${stepHTML(s.text)}</div>
      ${s.cue?`<div class="cue" style="margin-top:18px">✅ ${esc(s.cue)}</div>`:''}${s.tip?`<div class="tip">💡 ${esc(s.tip)}</div>`:''}${s.mistake?`<div class="mis">⚠️ ${esc(s.mistake)}</div>`:''}
      ${s.seconds>0?`<div class="bigtimer" id="bigTimer" data-i="${cookIdx}">${mmss(s.seconds)}</div><button class="btn sec" id="ct" style="margin-top:8px">⏱ 타이머 시작 / 정지</button>`:''}
      <div class="awake">${awakeSupported?'🔆 요리하는 동안 화면이 꺼지지 않아요':'⚠️ 이 브라우저는 화면 꺼짐 방지를 지원하지 않아요'}</div>
    </div>
    <div class="nav"><button class="btn" style="background:#3A2E27;color:#fff" id="cp" ${cookIdx===0?'disabled':''}>← 이전</button>
      <button class="btn pri" id="cn">${cookIdx===n-1?'완성! 🎉':'다음 →'}</button></div></div>`;
  $('#cx').onclick=closeCook;
  $('#cp').onclick=()=>{ if(cookIdx>0){cookIdx--; drawCook();} };
  $('#cn').onclick=()=>{ if(cookIdx<n-1){cookIdx++; drawCook();} else { closeCook(); toast('🎉 완성! 자랑 피드는 다음 업데이트에서 열려요'); } };
  const ct=$('#ct'); if(ct) ct.onclick=()=>toggleTimer(cookIdx);
  refreshTimerUI();
}
function closeCook(){ $('#layer').innerHTML=''; S.cooking=false; render(); }

/* ---------- 내 레시피 ---------- */
function saveRecipe(){
  if (S.recipeSavedId){ toast('이미 저장된 레시피예요'); return; }
  const id=uid(); S.my.unshift({id, recipe:S.recipe, savedAt:Date.now()});
  if (!LS.set('rc_recipes', S.my)){ S.my.shift(); toast('저장 공간이 부족해요'); return; }
  S.recipeSavedId=id; toast('📒 내 레시피에 저장했어요'); render();
}
function viewBox(){
  if (!S.my.length) return `<h2>내 레시피 📒</h2><div class="empty"><div class="big">🥄</div>아직 저장한 레시피가 없어요.<br>릴스를 공유해서 첫 레시피를 만들어 보세요!</div>`;
  return `<h2>내 레시피 📒</h2><p class="muted">${S.my.length}개 · 지금은 이 폰에만 저장돼요</p>` + S.my.map(d=>{ const r=d.recipe||{}; return `
    <div class="rc" data-open="${esc(d.id)}" role="button"><div class="em">${esc(r.emoji||'🍳')}</div><div style="flex:1;min-width:0">
    <div class="t">${esc(r.title)}</div><div class="s">⏱ ${esc(r.total_min||'?')}분 · ${esc(r.servings)}인분 · 재료 ${(r.ingredients||[]).length}개</div></div>
    <button data-del="${esc(d.id)}" style="color:#B9A89B;font-size:1.2rem;padding:8px" aria-label="삭제">🗑</button></div>`; }).join('');
}
function bindBox(){
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=e=>{ if(e.target.closest('[data-del]')) return;
    const d=S.my.find(x=>x.id===b.dataset.open); if(d) openRecipe(normalize(JSON.parse(JSON.stringify(d.recipe))), d.id); });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); confirmBox('이 레시피를 삭제할까요?', ()=>{ S.my=S.my.filter(x=>x.id!==b.dataset.del); LS.set('rc_recipes',S.my); render(); toast('삭제했어요'); }); });
}
function confirmBox(msg, ok){
  $('#layer').innerHTML=`<div class="modal"><div class="sheet"><h3>${esc(msg)}</h3><div class="row" style="margin-top:18px"><button class="btn ghost" style="flex:1" id="no">취소</button><button class="btn pri" style="flex:1" id="yes">확인</button></div></div></div>`;
  $('#no').onclick=()=>$('#layer').innerHTML=''; $('#yes').onclick=()=>{ $('#layer').innerHTML=''; ok(); };
}
function viewFeed(){ return `<h2>자랑 피드 🔥</h2><div class="empty"><div class="big">🚧</div><b>다음 업데이트에서 열려요</b><br>구글 로그인 + 사진 업로드 + 하트</div>`; }

/* ---------- 설정 ---------- */
$('#setBtn').onclick=()=>{
  const opt=(name,cur,list)=>`<div class="opt">${list.map(([v,l])=>`<button data-${name}="${v}" class="${cur===v?'on':''}">${l}</button>`).join('')}</div>`;
  $('#layer').innerHTML=`<div class="modal"><div class="sheet"><h3>⚙️ 설정</h3>
    <label class="fl">글자 크기</label>${opt('fs',S.fs,[['m','보통'],['l','크게'],['xl','아주 크게']])}
    <label class="fl">기본 분량 표시</label>${opt('un',S.unit,[['orig','🥄 영상 단위'],['precise','⚖️ g·ml']])}
    <label class="fl">앱 비밀번호</label>
    <input type="text" id="pw" value="${esc(S.pass)}" placeholder="Vercel의 APP_PASSCODE">
    <div class="row" style="margin-top:18px"><button class="btn ghost" style="flex:1" id="pwc">닫기</button><button class="btn pri" style="flex:1" id="pws">저장</button></div>
    <p class="muted" style="font-size:.8rem;margin-top:16px">릴쿡 ${VERSION}</p></div></div>`;
  document.querySelectorAll('[data-fs]').forEach(b=>b.onclick=()=>{ S.fs=b.dataset.fs; LS.set('rc_fs',S.fs); applyFs(); document.querySelectorAll('[data-fs]').forEach(x=>x.classList.toggle('on',x===b)); });
  document.querySelectorAll('[data-un]').forEach(b=>b.onclick=()=>{ S.unit=b.dataset.un; LS.set('rc_unit',S.unit); document.querySelectorAll('[data-un]').forEach(x=>x.classList.toggle('on',x===b)); });
  $('#pwc').onclick=()=>{ $('#layer').innerHTML=''; render(); };
  $('#pws').onclick=()=>{ S.pass=$('#pw').value.trim(); LS.set('rc_pass',S.pass); $('#layer').innerHTML=''; render(); toast('저장했어요'); };
};

/* ================= 시작 ================= */
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{ if(S.busy&&b.dataset.tab!=='import'){ toast('분석이 끝나면 이동할 수 있어요'); return; } stopAllTimers(); S.recipe=null; S.tab=b.dataset.tab; window.scrollTo(0,0); render(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
render();
if (new URLSearchParams(location.search).has('share')) readShareInbox();
</script>
</body>
