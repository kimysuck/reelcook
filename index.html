<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D23B1F">
<script>(function(){try{var l=+localStorage.getItem('rc_splash_at')||0;if(Date.now()-l<6*3600e3||/[?&](share|code)=/.test(location.search))document.documentElement.classList.add('nosplash');}catch(e){}})();</script>
<script>(function(){try{var t=JSON.parse(localStorage.getItem('rc_theme')||'"base"');if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'base';if(t!=='base')document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<title>릴쿡 — 릴스를 레시피로</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 릴쿡 디자인 v1.1 — 분식집 간판: 고추장 빨강 머리띠, 흰 밥상 바탕, 간장색 글씨
   노른자 노랑은 양념 비율·강조, 애호박 초록은 '다 됐다'에만. 사진이 주인공.
   제목·숫자: Black Han Sans / 본문: IBM Plex Sans KR */
:root{
  --bg:#FFFFFF; --paper:#FFFFFF; --ink:#2B1E18; --ink2:#5F4C42; --sub:#8D7C72; --line:#EBE0D5; --line2:#F5EEE7;
  --pri:#D23B1F; --pri-d:#AF2C14; --pri-t:#FDEBE5; --hot:#D23B1F; --hot-t:#FDEBE5;
  --yolk:#FFB81C; --yolk-d:#A86F00; --yolk-t:#FFF1CC; --herb:#3E8B3A; --herb-t:#E7F3E2;
  --f1:#FFB81C; --f2:#F57C1F; --f3:#D23B1F;
  --fs:17px; --disp:"Black Han Sans", "IBM Plex Sans KR", sans-serif;
}
html.fs-l{--fs:19px} html.fs-xl{--fs:21px}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:var(--fs)}
html,body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom));line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--pri);outline-offset:2px;border-radius:6px}
.wrap{max-width:600px;margin:0 auto;padding:0 20px}
.hidden{display:none!important}
svg.ic{width:1.25em;height:1.25em;flex-shrink:0;vertical-align:-.22em}
.disp{font-family:var(--disp);font-weight:400;letter-spacing:-.01em}

/* 테마: 밝게 — 흰 머리띠, 토마토색 버튼, 연한 노른자 */
html[data-theme=bright]{--pri:#F2552C;--pri-d:#D9441D;--pri-t:#FFEDE6;--hot:#F2552C;--hot-t:#FFEDE6;--ink:#3A2A22;--ink2:#6A574C;--yolk:#FFC93C;--yolk-t:#FFF5D6;--herb:#4FA046;--herb-t:#ECF7E6;--f3:#F2552C}
html[data-theme=bright] header.top{background:#fff;color:var(--pri);border-bottom:3px solid var(--yolk)}
html[data-theme=bright] .pill{color:var(--ink2)}
html[data-theme=bright] header .gauge i{background:var(--line)!important}
html[data-theme=bright] header .gauge.g3 i:nth-child(1){background:var(--f1)!important}html[data-theme=bright] header .gauge.g3 i:nth-child(2){background:var(--f2)!important}html[data-theme=bright] header .gauge.g3 i:nth-child(3){background:var(--f3)!important}
html[data-theme=bright] header :focus-visible{outline-color:var(--pri)}
/* 테마: 다크 — 숯불 앞처럼 어둡게, 빨강은 밝혀서 대비 확보 */
html[data-theme=dark]{color-scheme:dark;--bg:#17110E;--paper:#221A16;--ink:#F6EDE6;--ink2:#D4C3B7;--sub:#A8968A;--line:#3A2E28;--line2:#2B221D;--pri:#E9502F;--pri-d:#FF7A5C;--pri-t:#3A1F18;--hot:#FF6B4A;--hot-t:#3A1F18;--yolk-d:#FFC94D;--yolk-t:#3A2C10;--herb:#7CC46A;--herb-t:#1E2E1A}
html[data-theme=dark] header.top{background:#241B17;color:var(--hot);border-bottom:1px solid var(--line)}
html[data-theme=dark] .pill{color:var(--ink2)}
html[data-theme=dark] header .gauge i{background:var(--line)!important}
html[data-theme=dark] header .gauge.g3 i:nth-child(1){background:var(--f1)!important}html[data-theme=dark] header .gauge.g3 i:nth-child(2){background:var(--f2)!important}html[data-theme=dark] header .gauge.g3 i:nth-child(3){background:var(--f3)!important}
html[data-theme=dark] .ratio,html[data-theme=dark] .hero .back,html[data-theme=dark] .av,html[data-theme=dark] .avpick .big{color:#2B1E18!important}
html[data-theme=dark] .toast{background:#F6EDE6;color:#17110E}
html[data-theme=dark] .err{color:#FFB4A3} html[data-theme=dark] .note{color:#FFD98A} html[data-theme=dark] .note.ok{color:#A9DE9B}
html[data-theme=dark] .stx b{background:linear-gradient(transparent 58%, rgba(255,184,28,.38) 58%)}
html[data-theme=dark] .ing .dots{border-color:#5A4A40} html[data-theme=dark] .drop{border-color:#5A4A40}
html[data-theme=dark] .opt button.on,html[data-theme=dark] .tabs2 button.on{color:var(--bg)}
html[data-theme=dark] .pic{filter:brightness(.92)}
html[data-theme=dark] .shop.have .nm{color:#6E5E55}
html[data-theme=dark] .modal{background:rgba(0,0,0,.6)}

/* 머리 · 아래 탭 */
header.top{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{font-family:var(--disp);font-size:1.7rem;line-height:1;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo .gauge{height:16px}
header .gauge i{background:rgba(255,255,255,.3)!important}
header .gauge.g3 i:nth-child(1){background:#FFE08A!important}header .gauge.g3 i:nth-child(2){background:var(--yolk)!important}header .gauge.g3 i:nth-child(3){background:#fff!important}
header :focus-visible{outline-color:#fff}
.pill{display:flex;align-items:center;gap:6px;font-size:.88rem;color:#fff;padding:6px 4px;border-radius:8px}
#setBtn{padding:6px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:flex;height:64px;padding:0}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.74rem;color:var(--sub);position:relative}
nav.tabs button .ic{width:24px;height:24px}
nav.tabs button.on{color:var(--pri);font-weight:700}
nav.tabs button.on::before{content:"";position:absolute;top:0;left:32%;right:32%;height:3px;background:var(--pri);border-radius:0 0 3px 3px}

/* 글자 */
h2{font-family:var(--disp);font-weight:400;font-size:1.75rem;line-height:1.25;margin:26px 0 8px;letter-spacing:-.01em}
.muted{color:var(--sub);font-size:.92rem}
.lead{font-size:1rem;color:var(--ink2)}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:10px;font-weight:700;font-size:1rem;transition:background .15s}
.btn.pri{background:var(--pri);color:#fff;width:100%}
.btn.pri:active{background:var(--pri-d)}
.btn.pri:disabled{opacity:.45}
.btn.sec{background:var(--pri-t);color:var(--pri-d)}
.btn.ghost{border:1.5px solid var(--line);background:var(--paper)}
.btn.sm{min-height:40px;padding:0 14px;font-size:.88rem;border-radius:8px}
.btn.link{min-height:auto;padding:0;color:var(--pri);text-decoration:underline;text-underline-offset:3px;font-weight:500}
.row{display:flex;gap:10px;align-items:center}

/* 입력 */
label.fl{display:block;font-weight:700;font-size:.92rem;margin:18px 0 8px}
textarea,input[type=text],input[type=url],select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;background:var(--paper);font-size:1rem;outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--pri)}
textarea{min-height:130px;resize:vertical}
.drop{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed #D7C4B3;border-radius:10px;padding:16px;color:var(--ink2);font-size:.92rem;background:var(--paper);cursor:pointer}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs .t{position:relative;width:68px;height:90px;border-radius:6px;overflow:hidden}
.thumbs .t img{width:100%;height:100%;object-fit:cover}
.thumbs .t button{position:absolute;top:3px;right:3px;background:rgba(43,30,24,.75);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.thumbs .t button .ic{width:14px;height:14px}

/* 알림 */
.err{border-left:4px solid var(--hot);background:var(--hot-t);color:#8E2414;padding:12px 14px;border-radius:0 8px 8px 0;font-size:.94rem;margin-top:16px}
.note{border-left:4px solid var(--yolk-d);background:var(--yolk-t);color:#6B4A07;padding:10px 14px;border-radius:0 8px 8px 0;font-size:.9rem}
.note.ok{border-color:var(--herb);background:var(--herb-t);color:#2A6427}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:.92rem;z-index:300;max-width:88vw;text-align:center}
.spin{width:20px;height:20px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.sect{border-top:1.5px solid var(--ink);margin-top:28px;padding-top:4px}
.sect>summary,.sect>.hd{display:flex;align-items:center;justify-content:space-between;padding:14px 0;font-weight:700}
.sect>summary .ic{transition:transform .2s}
.sect[open]>summary .ic{transform:rotate(180deg)}
.banner{border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:16px;font-size:.92rem;background:var(--paper)}
.banner a{color:var(--pri);font-weight:700}
.install{display:flex;gap:12px;align-items:center;border:1.5px solid var(--pri);border-radius:10px;padding:12px 14px;margin-top:18px;font-size:.9rem;background:var(--paper)}
.install .btn{flex-shrink:0;width:auto}
.tips{margin-top:28px;color:var(--ink2);font-size:.9rem;border-top:1px solid var(--line);padding-top:14px}

/* 불 세기 게이지: 이 앱의 상징 */
.gauge{display:inline-flex;align-items:flex-end;gap:3px;height:15px}
.gauge i{display:block;width:5px;border-radius:1.5px;background:var(--line)}
.gauge i:nth-child(1){height:45%}.gauge i:nth-child(2){height:72%}.gauge i:nth-child(3){height:100%}
.gauge i:nth-child(1){--c:var(--f1)}.gauge i:nth-child(2){--c:var(--f2)}.gauge i:nth-child(3){--c:var(--f3)}
.gauge.g1 i:nth-child(-n+1),.gauge.g2 i:nth-child(-n+2),.gauge.g3 i:nth-child(-n+3){background:var(--c)}
.heat{display:inline-flex;align-items:center;gap:7px;font-size:.84rem;font-weight:700;color:var(--hot);margin-bottom:6px}
.heat.h0{color:var(--sub)}

/* 진행 */
.prog{margin-top:22px}
.prog .gauge{height:34px;gap:6px}
.prog .gauge i{width:11px;border-radius:3px;animation:fire 1.4s ease-in-out infinite}
.prog .gauge i:nth-child(2){animation-delay:.18s}.prog .gauge i:nth-child(3){animation-delay:.36s}
@keyframes fire{0%,100%{background:var(--line)}35%,65%{background:var(--c)}}
@media (prefers-reduced-motion: reduce){.prog .gauge i{animation:none;background:var(--c)}}
.prog-title{font-family:var(--disp);font-size:1.45rem;line-height:1.35;margin-top:18px}
.prog-time{color:var(--sub);font-size:.9rem;margin-top:4px}
.checks{margin-top:20px;border-top:1px solid var(--line)}
.checks div{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2);font-size:.95rem}
.checks .ok .ic{color:var(--herb)} .checks .no .ic{color:var(--yolk-d)}
.cap-peek{margin-top:14px;font-size:.85rem;color:var(--sub);max-height:7.5em;overflow:hidden;white-space:pre-wrap;border-left:3px solid var(--line);padding-left:12px}

/* 레시피 머리 */
.back{display:inline-flex;align-items:center;gap:4px;margin-top:14px;color:var(--ink2);font-size:.92rem;padding:6px 0}
.rhead h1{font-family:var(--disp);font-weight:400;font-size:2.3rem;line-height:1.18;letter-spacing:-.02em;margin-top:10px}
.rhead .sum{color:var(--ink2);margin-top:8px}
.meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:.88rem;color:var(--ink2);align-items:center}
.meta span{display:inline-flex;align-items:center;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px}
.chip.warn{color:var(--yolk-d);font-weight:700}
.origin{margin-top:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.origin summary{display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-size:.9rem;color:var(--ink2)}
.origin .body{padding-bottom:14px;font-size:.88rem;white-space:pre-wrap}
.origin .cm{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.serv{display:flex;align-items:center;justify-content:space-between;margin-top:22px}
.serv .lbl{font-weight:700}
.serv .lbl small{display:block;font-weight:400;color:var(--sub);font-size:.8rem}
.serv .ctl{display:flex;align-items:center;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.serv .ctl button{width:46px;height:44px;font-size:1.3rem;font-weight:700}
.serv .ctl b{font-family:var(--disp);font-weight:400;font-size:1.4rem;min-width:62px;text-align:center;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);line-height:44px}
.seg{display:flex;gap:4px;margin:22px -20px 0;padding:0 20px;position:sticky;top:57px;z-index:10;background:var(--bg);border-bottom:1.5px solid var(--line)}
.seg button{padding:12px 10px 10px;font-size:1rem;color:var(--sub);border-bottom:3px solid transparent;margin-bottom:-1.5px}
.seg button.on{color:var(--ink);font-weight:700;border-color:var(--ink)}
.unitsw{display:flex;gap:16px;margin-top:16px;font-size:.88rem}
.unitsw button{color:var(--sub);padding:4px 0;border-bottom:2px solid transparent}
.unitsw button.on{color:var(--pri);font-weight:700;border-color:var(--pri)}

/* 재료: 레시피 노트처럼 점선으로 잇기 */
.grp{font-weight:700;font-size:.9rem;color:var(--pri);margin:26px 0 2px}
.ing{padding:11px 0;border-bottom:1px solid var(--line2)}
.ing .ln{display:flex;align-items:baseline;gap:8px}
.ing .n{font-size:1.06rem;font-weight:500}
.ing .dots{flex:1;border-bottom:2px dotted #D7C4B3;transform:translateY(-.3em);min-width:20px}
.ing .big{font-family:var(--disp);font-size:1.3rem;white-space:nowrap}
.ing .sub{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--sub);margin-top:2px}
.ing .prep{color:var(--ink2)}
.est{color:var(--yolk-d);font-weight:700}
.ratio{background:var(--yolk);color:var(--ink);border-radius:12px;padding:18px 18px 16px;margin-top:18px}
.ratio .rv{display:flex;align-items:flex-end;gap:6px;flex-wrap:wrap}
.ratio .it{display:flex;flex-direction:column;align-items:center;min-width:46px}
.ratio .it b{font-family:var(--disp);font-weight:400;font-size:2.4rem;line-height:1}
.ratio .it span{font-size:.78rem;opacity:.85;margin-top:4px}
.ratio .co{font-family:var(--disp);font-size:1.8rem;opacity:.35;padding-bottom:20px}
.ratio p{font-size:.84rem;margin-top:12px;border-top:1.5px dashed rgba(43,30,24,.3);padding-top:10px}
.notes{margin-top:26px}
.notes h4{font-size:.92rem;margin-bottom:6px}
.notes li{margin:4px 0 4px 18px;font-size:.95rem;color:var(--ink2)}

/* 조리 단계 */
.stepc{display:grid;grid-template-columns:44px 1fr;gap:4px 12px;padding:22px 0;border-bottom:1px solid var(--line)}
.no{font-family:var(--disp);font-size:2rem;line-height:1;color:var(--pri)}
.stx{font-size:1.1rem;line-height:1.7}
.stx b{font-weight:700;background:linear-gradient(transparent 58%, #FFE29A 58%)}
.cue,.tip,.mis{margin-top:10px;font-size:.92rem;line-height:1.55;display:grid;grid-template-columns:auto 1fr;gap:8px}
.cue::before,.tip::before,.mis::before{font-weight:700;font-size:.8rem;padding-top:1px;white-space:nowrap}
.cue::before{content:"이때 다음으로";color:var(--herb)}
.tip::before{content:"팁";color:var(--ink2)}
.mis::before{content:"주의";color:var(--hot)}
.timer{margin-top:12px;display:inline-flex;align-items:center;gap:10px;border:1.5px solid var(--ink);border-radius:10px;padding:7px 12px;font-size:1rem;font-variant-numeric:tabular-nums}
.timer .tm{font-weight:700}
.timer button{color:var(--pri);font-weight:700}
.timer.done{border-color:var(--herb);background:var(--herb-t)}
.scene{position:relative;margin-top:14px;border-radius:8px;overflow:hidden;background:#2E2420;aspect-ratio:4/3;max-width:420px;cursor:pointer}
.scene img,.scene video{width:100%;height:100%;object-fit:cover;display:block}
.scene .play{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:6px;background:rgba(43,30,24,.8);color:#fff;font-size:.8rem;font-weight:700;padding:6px 10px;border-radius:6px}
.scene .snd{position:absolute;right:10px;bottom:10px;background:rgba(43,30,24,.8);color:#fff;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.scene.sk{display:flex;align-items:center;justify-content:center;color:#C9B8AC;font-size:.84rem;cursor:default;aspect-ratio:auto;height:80px;gap:8px}

/* 영양 */
.kcal{display:flex;align-items:baseline;gap:8px;margin-top:22px}
.kcal b{font-family:var(--disp);font-weight:400;font-size:3.2rem;line-height:1}
.kcal span{color:var(--sub)}
.nut{margin-top:16px;border-top:1.5px solid var(--ink)}
.nut .k{display:grid;grid-template-columns:5.5em 1fr 4.5em;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2);font-size:.95rem}
.nut .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--herb)}
.bar.hi i{background:var(--hot)}

/* 장보기 */
.shop{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line2)}
.shop input{width:22px;height:22px;accent-color:var(--herb);flex-shrink:0}
.shop .nm{flex:1;font-size:1.02rem;line-height:1.4}
.shop .nm small{display:block;color:var(--sub);font-size:.8rem}
.shop.have .nm{color:#B8A9A0;text-decoration:line-through}
.shop a{font-size:.8rem;font-weight:700;text-decoration:none;padding:6px 9px;border-radius:6px;border:1.5px solid var(--line);white-space:nowrap}

/* 레시피 하단 */
body.detail{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.detail nav.tabs{display:none}
.actbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom));transition:transform .25s ease}
.actbar.hide{transform:translateY(110%)}
.actbar .wrap{display:flex;gap:6px;align-items:center}
.icb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:56px;min-height:52px;border-radius:8px;font-size:.72rem;color:var(--ink2);font-weight:700}
.icb .ic{width:24px;height:24px}
.icb.on{color:var(--pri)}
.actbar .btn.pri{flex:1;min-height:52px}

/* 내 레시피: 완성 장면 사진이 표지 */

/* 시작 화면: 세로 릴스가 재생되고 → 레시피 카드로 변신 → 릴쿡 글자와 불 게이지 */
#splash{position:fixed;inset:0;z-index:400;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;transition:opacity .35s ease, visibility .35s}
#splash.out{opacity:0;visibility:hidden}
html.nosplash #splash{display:none}
#splash .stage{display:flex;flex-direction:column;align-items:center}
#splash .card{position:relative;width:84px;height:150px;border:3px solid #fff;border-radius:16px;overflow:hidden;opacity:0;transform:scale(.7);
  animation:pop .35s cubic-bezier(.3,1.4,.5,1) forwards, morph .45s cubic-bezier(.6,0,.3,1) .95s forwards}
#splash .play{position:absolute;left:50%;top:50%;margin:-13px 0 0 -8px;border-left:22px solid #fff;border-top:13px solid transparent;border-bottom:13px solid transparent;animation:fade .2s ease .85s forwards}
#splash .pbar{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--yolk);animation:play .55s linear .3s forwards, fade .15s ease .9s forwards}
#splash .rows{position:absolute;inset:16px 14px;display:flex;flex-direction:column;justify-content:center;gap:11px}
#splash .rows i{display:flex;align-items:center;gap:6px;height:8px;transform:scaleX(0);transform-origin:left;animation:grow .25s ease forwards}
#splash .rows i::before{content:"";width:34%;height:8px;border-radius:4px;background:#2B1E18}
#splash .rows i::after{content:"";width:18%;height:8px;border-radius:4px;background:var(--pri);margin-left:auto}
#splash .rows i span{flex:1;border-bottom:2px dotted #C9B8AC;transform:translateY(-1px)}
#splash .rows i:nth-child(1){animation-delay:1.35s}#splash .rows i:nth-child(2){animation-delay:1.47s}#splash .rows i:nth-child(3){animation-delay:1.59s}
#splash .rows i:nth-child(2)::before{width:26%}#splash .rows i:nth-child(3)::before{width:40%}#splash .rows i:nth-child(3)::after{width:13%}
#splash .w{font-family:var(--disp);font-size:4.4rem;line-height:1;letter-spacing:-.03em;display:flex;margin-top:26px}
#splash .ch{display:inline-block;opacity:0;transform:translateY(-24px);animation:drop .4s cubic-bezier(.3,1.5,.5,1) forwards}
#splash .ch:nth-child(1){animation-delay:1.7s}#splash .ch:nth-child(2){animation-delay:1.82s}
#splash .gauge{height:30px;gap:6px;margin-top:16px}
#splash .gauge i{width:10px;border-radius:3px;background:rgba(255,255,255,.28);animation:on .18s ease forwards}
#splash .gauge i:nth-child(1){--c:#FFE08A;animation-delay:2.0s}#splash .gauge i:nth-child(2){--c:var(--yolk);animation-delay:2.12s}#splash .gauge i:nth-child(3){--c:#fff;animation-delay:2.24s}
#splash .tag{margin-top:14px;font-size:.92rem;opacity:0;animation:fade-in .3s ease 2.2s forwards}
@keyframes pop{to{opacity:1;transform:none}}
@keyframes play{to{width:100%}}
@keyframes morph{to{width:200px;height:118px;border-radius:12px;background:#fff}}
@keyframes grow{to{transform:none}}
@keyframes fade{to{opacity:0}}
@keyframes fade-in{to{opacity:.9}}
@keyframes drop{to{opacity:1;transform:none}}
@keyframes on{to{background:var(--c)}}
@media (prefers-reduced-motion: reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}

/* ================= 분량 계산 ================= */
const FR = [[0,''],[0.25,'¼'],[1/3,'⅓'],[0.5,'½'],[2/3,'⅔'],[0.75,'¾']];
function frac(x){
  if (x == null || isNaN(x)) return '';
  if (x <= 0) return '0';
  if (x >= 10) return String(Math.round(x));
  let w = Math.floor(x), r = x - w, best = FR[0], bd = 9;
  for (const f of FR.concat([[1,'']])) { const d=Math.abs(r-f[0]); if (d<bd){bd=d;best=f;} }
  if (best[0]===1){ w+=1; best=FR[0]; }
  if (w===0 && !best[1]) return '¼';
  return (w? w : '') + best[1];
}
function roundAmt(v){
  if (v == null || isNaN(v)) return null;
  if (v < 2) return Math.round(v*10)/10;
  if (v < 10) return Math.round(v*2)/2;
  if (v < 100) return Math.round(v);
  if (v < 500) return Math.round(v/5)*5;
  return Math.round(v/10)*10;
}
function fmt(v,u){ const r=roundAmt(v); return r==null?'':`${r}${u}`; }
function spoons(ml){
  if (ml == null) return '';
  if (ml >= 100) return `종이컵 약 ${frac(ml/180)}컵`;
  if (ml < 1.25) return '';
  const half=Math.round(ml/2.5)*2.5, T=Math.floor(half/15), t=(half-T*15)/5, p=[];
  if (T) p.push(`${T}큰술`); if (t) p.push(`${frac(t)}작은술`);
  return '계량스푼 '+p.join(' ');
}
function precise(ing, f){
  const g=ing.grams!=null?ing.grams*f:null, ml=ing.ml!=null?ing.ml*f:null, cnt=ing.count!=null?ing.count*f:null;
  const p=ing.primary || (ml!=null?'ml':(g!=null?'g':'count'));
  if (p==='count' && cnt!=null) return {big:`${frac(cnt)}${ing.count_unit||'개'}`, alt: g!=null?`약 ${fmt(g,'g')}`:''};
  if (p==='ml' && ml!=null) return {big:fmt(ml,'ml'), alt:spoons(ml)};
  if (g!=null) return {big:fmt(g,'g'), alt: ml!=null?spoons(ml):''};
  if (cnt!=null) return {big:`${frac(cnt)}${ing.count_unit||'개'}`, alt:''};
  return {big:'적당량', alt:''};
}
const VAGUE = /^(약간|적당히|적당량|톡톡|조금|기호껏|취향껏)$/;
function original(ing, f){
  const u=(ing.orig_unit||'').trim();
  if (u && VAGUE.test(u)) return {big:'약간', alt:'맛보며 기호껏'};
  if (ing.orig_qty!=null && u) return {big:`${frac(ing.orig_qty*f)}${/^[a-z]+$/i.test(u)?'':' '}${u}`, alt:''};
  return null;
}
function amountOf(ing, f){
  const pr=precise(ing,f);

}

const SPOON = /^(숟갈|숟가락|밥숟가락|밥숟갈|큰술|스푼|T|tbsp|수저)$/i;

/* ================= 이미지 · 영상 처리 ================= */
async function shrink(blob, max=1024, q=0.82){
  const url=URL.createObjectURL(blob);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url;});
    const s=Math.min(1, max/Math.max(img.width,img.height));
    const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',q));
  } finally { URL.revokeObjectURL(url); }
}
async function videoFrames(blob, n=8, max=768){
  const url=URL.createObjectURL(blob), v=document.createElement('video');
  v.muted=true; v.playsInline=true; v.preload='auto'; v.src=url;
  const wait=(ev,ms=8000)=>new Promise((res,rej)=>{ const t=setTimeout(()=>rej(new Error('timeout '+ev)),ms); v.addEventListener(ev,()=>{clearTimeout(t);res();},{once:true}); });
  try{
    await wait('loadeddata',15000);
    const d=isFinite(v.duration)&&v.duration>0?v.duration:30;
    const s=Math.min(1, max/Math.max(v.videoWidth||max, v.videoHeight||max));
    const c=document.createElement('canvas'); c.width=Math.round((v.videoWidth||max)*s); c.height=Math.round((v.videoHeight||max)*s);
    const ctx=c.getContext('2d'), out=[];
    const times=[];
    for (let i=0;i<n;i++){ const t=Math.min(d-0.1,(i+0.5)/n*d); times.push(t); v.currentTime=t; await wait('seeked'); ctx.drawImage(v,0,0,c.width,c.height); out.push(await new Promise(r=>c.toBlob(r,'image/jpeg',0.8))); }
    return {frames:out, times};
  } finally { URL.revokeObjectURL(url); v.removeAttribute('src'); v.load(); }
}
function blobToB64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(blob); }); }
async function addImages(blobs){ for (const b of blobs){ if (S.images.length>=8) break; try{ const s=await shrink(b); S.images.push({blob:s,url:URL.createObjectURL(s)}); }catch(e){} } }

const URL_RE=/https?:\/\/[^\s]+/i;
async function readShareInbox(){
  if (!('caches' in window)) return;
  let started=false;
  try{
    const inbox=await caches.open('share-inbox');
    const metaRes=await inbox.match('/inbox/meta'); if (!metaRes) return;
    const meta=await metaRes.json();
    const all=[meta.title, meta.text, meta.url].filter(Boolean).join('\n');
    const m=all.match(URL_RE);
    resetInput(); if (m) S.link=m[0];
    const rest=all.replace(URL_RE,'').trim(); if (rest.length>15) S.caption=rest;
    const imgs=[]; let video=null;
    for (const f of meta.files||[]){ const r=await inbox.match(f.key); if(!r) continue; const b=await r.blob();
      if ((f.type||'').startsWith('video/')) video=video||{b,name:f.name}; else if ((f.type||'').startsWith('image/')) imgs.push(b); }
    for (const k of await inbox.keys()) await inbox.delete(k);
    S.tab='import'; S.recipe=null;
    history.replaceState(null,'','/');
    if (video){ S.busy=true; S.phase='frames'; S.t0=Date.now(); render(); await addVideo(video.b, video.name); S.busy=false; }
    if (imgs.length) await addImages(imgs);
    if (m || video || imgs.length || S.caption){ started=true; analyze(); }
  }catch(e){}
  if (!started){ history.replaceState(null,'','/'); render(); }
}
function resetInput(){ S.images.forEach(x=>URL.revokeObjectURL(x.url)); S.images=[]; S.videoBlob=null; S.frameTimes=null; S.caption=''; S.link=''; S.fromVideo=false; S.fetched=null; S.error=''; S.shareNote=''; }

function toSec(v){ if (v==null||v==='') return null; if (typeof v==='number') return isFinite(v)?v:null; const p=String(v).trim().split(':').map(Number); if (p.some(isNaN)) return null; return p.reduce((a,x)=>a*60+x,0); }
function num(v){ if (v===null||v===undefined||v==='') return null; const n=Number(v); return isNaN(n)?null:n; }
function parseJSON(txt){ const a=txt.indexOf('{'), b=txt.lastIndexOf('}'); if(a<0||b<0) throw new Error('JSON 없음'); return JSON.parse(txt.slice(a,b+1)); }
function normalize(r){
  r.ingredients=(r.ingredients||[]).map(i=>({...i, grams:num(i.grams), ml:num(i.ml), count:num(i.count), orig_qty:num(i.orig_qty)}));
  r.steps=(r.steps||[]).map(s=>{ const st={...s, seconds:num(s.seconds)||0, photo:toSec(s.photo), frame:num(s.frame)};
    const a=toSec(s.clip&&s.clip.start), b=toSec(s.clip&&s.clip.end); st.clip = a!=null ? {start:a, end: b!=null&&b>a ? b : a+4} : null;
    if (st.photo==null && st.clip) st.photo=(st.clip.start+st.clip.end)/2; return st; }); r.tools=r.tools||[];
  r.assumptions=(r.assumptions||[]).filter(Boolean); r.beginner_notes=(r.beginner_notes||[]).filter(Boolean).slice(0,3);
  r.servings=Math.max(1, Math.round(num(r.servings)||2)); r.nutrition_per_serving=r.nutrition_per_serving||{};
  return r;
}
async function api(path, body){

const ERR = {
  passcode:'앱 비밀번호가 맞지 않아요. 설정에서 다시 입력해 주세요.',
  rate_limited:'모든 AI 모델이 무료 사용량 속도 제한에 걸렸어요. 1~2분 뒤 다시 시도해 주세요.',
  quota_day:'오늘 쓸 수 있는 AI 무료 사용량을 모두 썼어요.',
  busy:'지금 Google AI 모델이 모두 붐벼요. 1~2분 뒤에 다시 시도해 주세요.',
  no_key:'서버에 GEMINI_API_KEY가 없어요. (Vercel 환경변수 확인)',
  bad_image:'사진 형식이나 크기를 처리하지 못했어요.',

const kst=iso=>{ try{ return new Date(iso).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'long',day:'numeric',hour:'numeric',minute:'2-digit'}); }catch(e){ return ''; } };
let tick=null;
// 스트리밍 요청: 서버가 진행 상황과 5초마다 신호를 보내 연결이 끊기지 않게 한다
async function streamAnalyze(body, onEvent){
  const r=await fetch('/api/analyze',{ method:'POST', headers:{'Content-Type':'application/json', ...(S.pass?{'x-app-passcode':S.pass}:{})}, body:JSON.stringify({...body, stream:true}) });
  if (!r.ok || !r.body || !(r.headers.get('content-type')||'').includes('ndjson')){
    const data=await r.json().catch(()=>({})); return { status:r.status, ...data };
  }
  const reader=r.body.getReader(), dec=new TextDecoder(); let buf='', final=null;
  while(true){
    const {value, done}=await reader.read(); if (done) break;
    buf+=dec.decode(value,{stream:true}); let i;
    while((i=buf.indexOf('\n'))>=0){ const line=buf.slice(0,i).trim(); buf=buf.slice(i+1); if(!line) continue;
      let ev; try{ ev=JSON.parse(line); }catch(e){ continue; }
      if (ev.done) final=ev; else onEvent(ev); }
  }
  if (!final) throw new Error('__cut');
  return final;
}
async function analyze(opts={}){
  const igLink=/instagram\.com\/.*(reel|reels|p|tv)\//i.test(S.link);
  if (!S.caption.trim() && !S.images.length && !igLink){ S.error='릴스 링크를 넣거나, 캡션·사진·영상을 넣어 주세요.'; render(); return; }
  S.busy=true; S.error=''; S.canRetry=false; S.shareNote=''; S.t0=S.t0&&S.phase==='frames'?S.t0:Date.now(); S.fetched=null; S.note2='';
  S.phase = igLink && !S.images.length ? 'fetch' : 'analyze'; render();
  clearInterval(tick); tick=setInterval(()=>{ const el=$('#elapsed'); if(el) el.textContent=`${Math.round((Date.now()-S.t0)/1000)}초`; },1000);
  try{
    const body={caption:S.caption.trim(), link:S.link.trim(), fromVideo:S.fromVideo, noCache:!!opts.noCache};
    if (S.images.length){ body.images=[]; for (const x of S.images) body.images.push({mime:'image/jpeg', data: await blobToB64(x.blob)}); }
    const data=await streamAnalyze(body, ev=>{
      if (ev.stage==='cached'){ S.phase='cached'; render(); }
      else if (ev.stage==='fetch'){ S.phase='fetch'; render(); }
      else if (ev.stage==='fetched'){ S.fetched={caption:ev.caption, comments:ev.comments, videoUrl:ev.videoUrl, duration:ev.duration}; if (ev.videoSrc) prefetchReel(ev.videoSrc); render(); }
      else if (ev.stage==='download'){ S.phase='download'; render(); }
      else if (ev.stage==='analyze'){ S.phase='analyze'; S.fetched={...(S.fetched||{}), visualOnly:ev.visualOnly, longVideo:ev.longVideo, gotVideo:ev.gotVideo, videoMB:ev.videoMB}; render(); }
      else if (ev.stage==='busy'){ S.note2='AI 모델이 잠시 붐벼서 한 번 더 시도하는 중…'; render(); }
      else if (ev.stage==='switch'){ S.note2={busy:'이 AI 모델이 붐벼서 다른 모델로 바꿔 분석하는 중…', quota:'이 모델의 분당 무료 사용량이 차서 다른 모델로 바꾸는 중…', day:'이 모델의 오늘 무료 한도가 끝나서 다른 모델로 바꾸는 중…'}[ev.why]||'다른 AI 모델로 바꾸는 중…'; render(); }
      else if (ev.stage==='wait'){ S.note2=`무료 사용량 속도 제한 때문에 ${ev.sec}초 기다렸다가 이어서 분석해요…`; render(); }
      else if (ev.stage==='retry'){ S.note2='레시피를 확실히 찾지 못해서 영상 자막과 음성까지 더 꼼꼼하게 다시 보는 중…'; render(); }
    });
    if (data.error || (data.status && data.status!==200)){
      if (data.error==='need_input'){ S.shareNote='link'; throw new Error('이 릴스의 캡션과 영상을 가져오지 못했어요. 비공개 계정이거나 일시적인 문제일 수 있어요.'); }
      if (data.error==='too_long'){ S.canRetry=true; throw new Error('영상이 길어서 시간 안에 분석을 끝내지 못했어요. 다시 시도하거나, 캡션을 붙여넣어 주세요.'); }
      if (data.error==='busy'||data.error==='rate_limited') S.canRetry=true;
      if (data.error==='quota_day') throw new Error(`${ERR.quota_day} ${data.resetAt?kst(data.resetAt)+'에 다시 채워져요.':''} 설정 > AI 사용량에서 확인할 수 있어요.`);
      throw new Error(ERR[data.error] || `분석 서버 오류 (${data.error||data.status}${data.message?': '+data.message:''})`);
    }
    const res=parseJSON(data.text), list=(Array.isArray(res.recipes)?res.recipes:[res]).filter(r=>r&&Array.isArray(r.ingredients)&&r.ingredients.length);
    if (!list.length) throw new Error(res.is_food===false ? `요리를 만드는 릴스가 아닌 것 같아요${res.reason?` (${res.reason})`:''}. 요리 과정이 나오는 릴스를 공유해 주세요.` : '이 릴스에서 레시피를 찾지 못했어요. 캡션을 직접 붙여넣거나 다른 릴스로 시도해 주세요.');
    const src=data.source||{}, ev=res.evidence||{};
    const base={cached:!!src.cached, link:S.link.trim(), caption:src.caption||S.caption.trim(), comments:src.comments||[], model:data.model, gotVideo:!!src.gotVideo, visualOnly:!!src.visualOnly, frames:S.fromVideo, sec:Math.round((Date.now()-S.t0)/1000), videoUrl:src.videoUrl||null, duration:src.duration||null, speech:ev.speech?1:0, subs:ev.onscreen_text?1:0};
    const set=list.map(r=>{ const rec=normalize(r); rec.source={...base}; return rec; });
    // 갤러리 영상/스크린샷으로 분석한 경우: 이미지 번호 → 장면
    let localVideo=null, useShots=false;
    if (S.fromVideo && S.videoBlob && S.frameTimes){ localVideo=S.videoBlob;
      set.forEach(rec=>rec.steps.forEach(st=>{ if (st.frame!=null && S.frameTimes[st.frame]!=null && st.photo==null){ st.photo=S.frameTimes[st.frame]; st.clip={start:Math.max(0,st.photo-2), end:st.photo+2}; } })); }
    else if (S.images.length) useShots=true;
    const imgs=S.images.slice();
    S.busy=false; clearInterval(tick); S.t0=0;
    S.setMedia=rec=>({videoBlob:localVideo, shotBlobs: useShots ? rec.steps.map(st=> st.frame!=null && imgs[st.frame] ? imgs[st.frame].blob : null) : null});
    openRecipe(set[0], null, set);
    prepareMedia(set[0], S.setMedia(set[0]));
    if (set.length>1) toast(`이 릴스에서 레시피 ${set.length}개를 찾았어요`);
  }catch(e){
    const net = e instanceof TypeError || e.message==='__cut' || /fetch|network|load failed/i.test(e.message);
    if (net){ S.canRetry=true; S.error='인터넷 연결이 중간에 끊겼어요. 와이파이·데이터 상태를 확인하고 다시 시도해 주세요.'; }

  }
}

const IDB = {
  db:null,
  open(){ if (this.db) return Promise.resolve(this.db); return new Promise((res,rej)=>{ const r=indexedDB.open('reelcook',1); r.onupgradeneeded=()=>r.result.createObjectStore('media'); r.onsuccess=()=>{ this.db=r.result; res(r.result); }; r.onerror=()=>rej(r.error); }); },
  async tx(mode, fn){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction('media',mode); const out=fn(t.objectStore('media')); t.oncomplete=()=>res(out&&out.result); t.onerror=()=>rej(t.error); }); },
  put(k,v){ return this.tx('readwrite', st=>st.put(v,k)); },
  get(k){ return this.tx('readonly', st=>st.get(k)); },
  del(k){ return this.tx('readwrite', st=>st.delete(k)); },
};

  v.addEventListener('loadedmetadata',()=>{ v.currentTime=s0; v.play().catch(()=>{}); },{once:true});
  v.addEventListener('timeupdate',()=>{ if (v.currentTime>=e0 || v.currentTime<s0-1) v.currentTime=s0; });

// 같은 릴스 영상은 한 번만 받는다. 분석하는 동안 미리 받기 시작하면, 결과가 나올 때 장면이 거의 바로 뜬다.
let reelMemo=null;
function downloadReel(u, onPct){
  if (!reelMemo || reelMemo.u!==u || reelMemo.failed){
    const memo={u, pct:0, subs:new Set(), failed:false};
    memo.p=downloadReel0(u, p=>{ memo.pct=p; memo.subs.forEach(f=>f(p)); }).catch(e=>{ memo.failed=true; throw e; });
    reelMemo=memo;
  }
  if (onPct){ reelMemo.subs.add(onPct); onPct(reelMemo.pct); }
  return reelMemo.p;
}
function prefetchReel(u){ try{ downloadReel(u).catch(()=>{}); }catch(e){} }
async function downloadReel0(u, onPct){
  const CH=2*1024*1024, url=`/api/video?u=${encodeURIComponent(u)}&k=${encodeURIComponent(S.pass||'')}`;
  const get=async (a,b)=>{ const r=await fetch(url,{headers:{Range:`bytes=${a}-${b}`}}); if (r.status===410) throw new Error('expired'); if (!r.ok) throw new Error('http '+r.status); return r; };
  const r0=await get(0, CH-1), first=await r0.blob();
  const cr=r0.headers.get('content-range'), total = cr && /\/(\d+)/.test(cr) ? +cr.match(/\/(\d+)/)[1] : first.size;
  if (r0.status===200 || first.size>=total) { onPct(1); return new Blob([first],{type:'video/mp4'}); }
  const ranges=[]; for (let a=first.size; a<total; a+=CH) ranges.push([a, Math.min(a+CH, total)-1]);
  const parts=new Array(ranges.length); let done=first.size, next=0; onPct(done/total);
  const worker=async()=>{ while (next<ranges.length){ const k=next++; const [a,b]=ranges[k];
    let blob=null; for (let t=0; t<3 && !blob; t++){ try{ blob=await (await get(a,b)).blob(); }catch(e){ if (e.message==='expired' || t===2) throw e; } }
    parts[k]=blob; done+=blob.size; onPct(Math.min(1, done/total)); } };
  await Promise.all([worker(), worker(), worker()]);
  return new Blob([first, ...parts],{type:'video/mp4'});
}
async function makeThumbs(url, steps, coverT=null){
  const v=document.createElement('video'); v.muted=true; v.playsInline=true; v.preload='auto'; v.src=url;
  const wait=(ev,ms=8000)=>new Promise((res,rej)=>{ const t=setTimeout(()=>rej(new Error('t')),ms); v.addEventListener(ev,()=>{clearTimeout(t);res();},{once:true}); });
  await wait('loadeddata',20000);
  const d=v.duration||0, W=480, sc=Math.min(1, W/(v.videoWidth||W));
  const c=document.createElement('canvas'); c.width=Math.round((v.videoWidth||W)*sc); c.height=Math.round((v.videoHeight||W)*sc); const ctx=c.getContext('2d');
  const out=[];
  for (const st of steps){
    if (st.photo==null){ out.push(null); continue; }
    try{ v.currentTime=Math.min(Math.max(0,st.photo), Math.max(0,d-0.1)); await wait('seeked'); ctx.drawImage(v,0,0,c.width,c.height); out.push(await new Promise(r=>c.toBlob(r,'image/jpeg',0.8))); }
    catch(e){ out.push(null); }
  }
  if (coverT!=null){ try{ v.currentTime=Math.min(Math.max(0,coverT), Math.max(0,d-0.1)); await wait('seeked'); ctx.drawImage(v,0,0,c.width,c.height); out.cover=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85)); }catch(e){} }
  v.removeAttribute('src'); v.load();
  return out;
}
function mediaReady(m){ if (m.dead) return; m.status='ready'; m.thumbs=(m.thumbBlobs||[]).map(b=>b?URL.createObjectURL(b):null); ensureCover(m); if (S.recipe && S.media===m && !playing){ if (S.cooking) drawCook(); else render(); } }
async function prepareMedia(rec, {videoBlob=null, shotBlobs=null}={}){
  if (!rec.steps.some(hasScene)) return;
  const m={status:'loading', pct:0}; S.media=m;
  if (S.recipe===rec) render();
  try{
    if (shotBlobs && !videoBlob){ m.thumbBlobs=shotBlobs; m.coverBlob=rec.cover_frame!=null&&S.images&&S.images[rec.cover_frame]?S.images[rec.cover_frame].blob:null; m.blob=null; return mediaReady(m); }
    let blob=videoBlob;
    if (!blob && rec.source && rec.source.videoUrl){
      try{ blob=await downloadReel(rec.source.videoUrl, p=>{ m.pct=p; mediaProgress(); }); }
      catch(e){
        if (e.message!=='expired' || !rec.source.link) throw e;
        // 인스타 영상 주소는 며칠 뒤 만료됨 → 새 주소를 받아 한 번 더
        const {r,data}=await api('/api/reel',{link:rec.source.link});
        if (!r.ok || !data.videoUrl) throw e;
        rec.source.videoUrl=data.videoUrl;
        blob=await downloadReel(data.videoUrl, p=>{ m.pct=p; mediaProgress(); });
      }
    }
    if (!blob || m.dead){ m.status='none'; return; }
    m.blob=blob; m.url=URL.createObjectURL(blob);
    const th=await makeThumbs(m.url, rec.steps, rec.cover_time!=null&&!rec.cover ? toSec(rec.cover_time) : null);
    m.thumbBlobs=[...th]; m.coverBlob=th.cover||null;
    mediaReady(m);
  }catch(e){ m.status='none'; if (S.recipe===rec && S.media===m) render(); }
}
async function persistMedia(id){
  const m=S.media; if (!m) return;
  const wait=async()=>{ for(let i=0;i<120 && m.status==='loading';i++) await new Promise(r=>setTimeout(r,1000)); };
  await wait(); if (m.status!=='ready') return;
  try{ await IDB.put(id, {video:m.blob||null, thumbs:m.thumbBlobs||[]}); }
  catch(e){ try{ await IDB.put(id, {video:null, thumbs:m.thumbBlobs||[]}); toast('저장 공간이 부족해 장면 사진만 저장했어요'); }catch(_){} }
}
async function restoreMedia(rec, id){
  if (!rec.steps.some(hasScene)) return;
  let saved=null; try{ saved=await IDB.get(id); }catch(e){}
  if (S.recipe!==rec) return;
  if (saved && (saved.video || (saved.thumbs||[]).some(Boolean))){

    if (m.blob) m.url=URL.createObjectURL(m.blob);

  }
  if (rec.source && rec.source.videoUrl){ await prepareMedia(rec); if (S.media && S.media.status==='ready') persistMedia(id); }
}

function beep(){
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    [0,0.35,0.7].forEach(d=>{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.25,actx.currentTime+d); g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d+0.3); o.start(actx.currentTime+d); o.stop(actx.currentTime+d+0.3); }); }catch(e){}
  try{ navigator.vibrate&&navigator.vibrate([300,150,300]); }catch(e){}
}
function toggleTimer(i){
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); actx.resume&&actx.resume(); }catch(e){}
  const s=S.recipe.steps[i], t=T[i] ||= {left:s.seconds,run:false,iv:null,done:false};
  if (t.done){ t.left=s.seconds; t.done=false; }
  if (t.run){ clearInterval(t.iv); t.run=false; }
  else { t.run=true; const end=Date.now()+t.left*1000;
    t.iv=setInterval(()=>{ t.left=(end-Date.now())/1000; if(t.left<=0){ t.left=0; t.run=false; t.done=true; clearInterval(t.iv); beep(); toast(`${i+1}단계 시간이 끝났어요`); } refreshTimerUI(); },250); }
  refreshTimerUI();
}

async function mosaicOf(blob, cells=12){
  const url=URL.createObjectURL(blob);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url;});
    const W=Math.min(800,img.width), H=Math.round(img.height*W/img.width);
    const sm=document.createElement('canvas'); sm.width=cells; sm.height=Math.max(1,Math.round(cells*H/W)); sm.getContext('2d').drawImage(img,0,0,sm.width,sm.height);
    const c=document.createElement('canvas'); c.width=W; c.height=H; const ctx=c.getContext('2d'); ctx.imageSmoothingEnabled=false; ctx.drawImage(sm,0,0,W,H);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',0.7));
  } finally { URL.revokeObjectURL(url); }
}

S.profile=null;
async function loadProfile(){
  const {data}=await sb.from('profiles').select('name,avatar,setup_done,avatar_flagged').eq('id',S.user.id).single();
  S.profile=data||{name:'', avatar:null, setup_done:false};
}
let prof={};
function openProfile(first){
  const md=S.user.user_metadata||{}, pf=S.profile||{};
  prof={ first, name: pf.name || md.full_name || md.name || '', mode: first ? (md.avatar_url?'google':'none') : 'keep', blob:null, url:null };
  drawProfile();
}
function drawProfile(){
  const md=S.user.user_metadata||{}, pf=S.profile||{};
  const preview = prof.mode==='upload'&&prof.url ? prof.url : prof.mode==='google' ? md.avatar_url : prof.mode==='keep' ? pf.avatar : null;
  $('#layer').innerHTML=`<div class="modal"><div class="sheet">
    <h3>${prof.first?'피드에 보일 이름과 사진을 정해 주세요':'프로필 편집'}</h3>
    ${prof.first?'<p class="muted" style="margin-top:6px">나중에 설정에서 바꿀 수 있어요.</p>':''}
    <label class="fl">프로필 사진</label>
    <div class="avpick"><div class="big">${preview?`<img src="${esc(preview)}" referrerpolicy="no-referrer" alt="">`:esc((prof.name||'?').slice(0,1))}</div>
      <div style="display:flex;flex-direction:column;gap:6px;flex:1">
        <label class="btn ghost sm" for="avIn" style="cursor:pointer">${IC.image}사진 고르기</label>
        ${md.avatar_url?`<button class="btn ghost sm" id="avG">구글 사진 쓰기</button>`:''}
        <button class="btn ghost sm" id="avN">사진 없이</button></div></div>
    <input type="file" id="avIn" accept="image/*" class="hidden">
    ${pf.avatar_flagged&&prof.mode==='keep'?'<div class="note" style="margin-top:12px">지금 사진은 부적절하다고 판단되어 모자이크 처리됐어요.</div>':''}
    <label class="fl">닉네임 (1~20자)</label><input type="text" id="nn" maxlength="20" value="${esc(prof.name)}" placeholder="예: 자취요리왕">
    <p class="guard">${IC.shield}<span>사진과 닉네임은 자동으로 검토돼요. 부적절한 사진은 모자이크 처리되고, 부적절한 닉네임은 쓸 수 없어요.</span></p>
    <div class="row" style="margin-top:16px">${prof.first?'':'<button class="btn ghost" style="flex:1" id="pfc">닫기</button>'}<button class="btn pri" style="flex:1" id="pfs">${prof.first?'이대로 시작':'저장'}</button></div>
    ${prof.first?'':'<button class="btn ghost sm" id="logout2" style="margin-top:14px;width:100%">로그아웃</button>'}
    <div id="pferr"></div></div></div>`;
  const keep=()=>{ prof.name=$('#nn').value; };
  $('#avIn').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; keep(); prof.blob=await shrink(f,640,0.85); if(prof.url) URL.revokeObjectURL(prof.url); prof.url=URL.createObjectURL(prof.blob); prof.mode='upload'; drawProfile(); };
  const g=$('#avG'); if(g) g.onclick=()=>{ keep(); prof.mode='google'; drawProfile(); };
  $('#avN').onclick=()=>{ keep(); prof.mode='none'; drawProfile(); };
  const c=$('#pfc'); if(c) c.onclick=()=>$('#layer').innerHTML='';
  const lo=$('#logout2'); if(lo) lo.onclick=async()=>{ await signOut(); $('#layer').innerHTML=''; toast('로그아웃했어요'); };
  $('#pfs').onclick=saveProfile;
}
async function saveProfile(){
  const btn=$('#pfs'), name=$('#nn').value.trim();
  if (!name){ $('#pferr').innerHTML='<div class="err">닉네임을 적어 주세요.</div>'; return; }
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> 검토하는 중';
  const body={name};
  if (prof.mode==='upload' && prof.blob){ body.photo=await blobToB64(prof.blob); body.mosaic=await blobToB64(await mosaicOf(prof.blob)); }
  else if (prof.mode==='google') body.useGoogle=true;
  else if (prof.mode==='none') body.clearAvatar=true;
  const {r,data}=await authApi('/api/profile', body);
  if (!r.ok){ btn.disabled=false; btn.textContent='다시 시도'; $('#pferr').innerHTML=`<div class="err">${esc(MOD_ERR[data.error]||('저장하지 못했어요 ('+(data.error||r.status)+')'))}${data.reason?` (${esc(data.reason)})`:''}${data.detail?`<div style="font-size:.78rem;margin-top:6px;opacity:.8">원인: ${esc(data.detail)}</div>`:''}</div>`; return; }
  S.profile=data.profile; $('#layer').innerHTML=''; renderWho();
  if (data.flagged) toast('사진이 부적절하다고 판단되어 모자이크 처리했어요'); else toast('프로필을 저장했어요');
  S.feed=null; if (!S.recipe && !S.busy) render();
}

/* ---------- 공유 시트 ---------- */
function recipeText(r){
  const k2=S.servings/r.servings;
  return `${r.title} (${S.servings}인분)\n\n[재료]\n${r.ingredients.map(i=>`- ${i.name} ${amountOf(i,k2).big}`).join('\n')}\n\n[만드는 법]\n${r.steps.map((st,i)=>`${i+1}. ${st.text.replace(/\[\[(\d+)\]\]/g,(m,x)=>{ const g=r.ingredients[+x]; return g?`${g.name} ${amountOf(g,k2).big}`:''; })}`).join('\n')}${r.source&&r.source.link?`\n\n원본: ${r.source.link}`:''}\n— 릴쿡으로 정리함`;
}
function openShareSheet(r){
  $('#layer').innerHTML=`<div class="modal"><div class="sheet"><div class="row" style="justify-content:space-between"><h3>공유하기</h3><button class="x" id="shClose" aria-label="닫기">${IC.x}</button></div>
    <div style="margin-top:8px">
    ${sb?`<button class="choice" id="shR">${IC.book}<div><b>레시피만 공유</b><span>사진 없이 이 레시피를 피드에 올려요</span></div></button>
    <button class="choice" id="shC">${IC.camera}<div><b>요리 인증</b><span>직접 만든 요리 사진과 맛 평가를 올려요</span></div></button>`:''}
    <button class="choice" id="shX">${IC.chat}<div><b>카톡 등 다른 앱으로 보내기</b><span>재료와 순서를 글로 보내요</span></div></button></div></div></div>`;
  $('#shClose').onclick=()=>$('#layer').innerHTML='';
  const a=$('#shR'); if(a) a.onclick=()=>openComposer(r,'recipe');
  const b=$('#shC'); if(b) b.onclick=()=>openComposer(r,'cook');
  $('#shX').onclick=async()=>{ const text=recipeText(r);
    try{ if (navigator.share){ await navigator.share({title:r.title, text}); $('#layer').innerHTML=''; return; } }catch(e){ if(e.name==='AbortError') return; }
    try{ await navigator.clipboard.writeText(text); toast('레시피를 복사했어요. 카톡에 붙여넣기 하세요'); $('#layer').innerHTML=''; }catch(e){ toast('공유하지 못했어요'); } };
}

/* ---------- 자랑 피드 ---------- */
S.feedFilter='all';
function viewFeed(){
  if (!sb) return `<h2>자랑 피드</h2><div class="empty"><b>아직 열 수 없어요</b>서버에 Supabase 설정이 필요해요.</div>`;
  if (!S.user) return `<h2>자랑 피드</h2><p class="lead">만든 요리를 올리고, 친구들 레시피를 저장해 보세요.</p><div style="margin-top:18px">${gbtn()}</div>`;
  if (S.feed===null){ loadFeed().then(()=>{ if(S.tab==='feed'&&!S.recipe) render(); }); return `<h2>자랑 피드</h2><p class="muted">불러오는 중…</p>`; }
  let h=`<div class="feedhd"><h2>자랑 피드</h2><button class="pill" id="fRefresh" aria-label="새로고침">${IC.refresh}</button></div>
    <div class="row" style="margin-top:16px"><button class="btn pri" id="newCook" style="flex:1.2">${IC.camera}요리 인증</button><button class="btn sec" id="newRecipe" style="flex:1">${IC.book}레시피 공유</button></div>
    <div class="chips">${[['all','전체'],['cook','요리 인증'],['recipe','레시피']].map(([v,l])=>`<button data-ff="${v}" class="${S.feedFilter===v?'on':''}">${l}</button>`).join('')}</div>`;
  if (S.feedErr) h+=`<div class="err">피드를 불러오지 못했어요: ${esc(S.feedErr)}</div>`;
  const list=S.feed.filter(p=>S.feedFilter==='all'||(p.kind||'cook')===S.feedFilter);
  if (!list.length) return h+`<div class="empty"><b>아직 글이 없어요</b>요리 인증이나 레시피 공유로 첫 글을 올려 보세요.</div>`;
  return h+list.map(p=>{ const pr=p.profiles||{}, liked=S.liked.has(p.id), kind=p.kind||'cook', r=p.recipe;
    const top = kind==='cook'
      ? (p.photo_path?`<div class="phwrap"><img class="ph" src="${esc(photoUrl(p.photo_path))}" alt="" loading="lazy">${p.flagged?'<span class="flagged">부적절한 사진으로 판단되어 가렸어요</span>':''}</div>`:'')
      : '';
    return `<div class="post"><div class="au">${avatarHTML(pr.name, pr.avatar)}<b>${esc(pr.name||'요리하는 사람')}</b><span>${timeAgo(p.created_at)}</span><span class="kindtag kt-${kind}">${kind==='cook'?'요리 인증':'레시피'}</span></div>${top}
    <div class="bd">
      <div class="tt">${esc(p.title)}</div>
      ${kind==='cook'&&p.taste?`<div class="stars" aria-label="맛 ${p.taste}점">${'★'.repeat(p.taste)}<span style="color:var(--line)">${'★'.repeat(5-p.taste)}</span></div>`:''}
      ${p.body?`<div class="tx">${esc(p.body)}</div>`:''}
      ${r?`<div class="rcard">${coverHTML({title:r.title})}<div style="flex:1;min-width:0"><b>${esc(r.title)}</b><div class="s"><span>${esc(r.total_min||'?')}분</span><span>재료 ${(r.ingredients||[]).length}개</span>${r.difficulty?`<span>${esc(r.difficulty)}</span>`:''}</div></div></div>`:''}
      <div class="acts"><button class="like ${liked?'on':''}" data-like="${esc(p.id)}" aria-label="하트">${liked?IC.heartOn:IC.heart}${p.likeCount}</button>
        ${r?`<button class="btn ghost sm" data-precipe="${esc(p.id)}">레시피 보기</button><button class="btn ghost sm" data-psave="${esc(p.id)}" aria-label="내 레시피에 저장">${IC.save}</button>`:''}
        ${p.user_id===S.user.id?`<button class="del" style="margin-left:auto;color:#B8A9A0;padding:8px" data-pdel="${esc(p.id)}" aria-label="삭제">${IC.trash}</button>`:''}</div>
    </div></div>`; }).join('');
}
function bindFeed(){
  bindLogin();
  const rf=$('#fRefresh'); if(rf) rf.onclick=()=>{ S.feed=null; render(); };
  const nc=$('#newCook'); if(nc) nc.onclick=()=>openComposer(null,'cook');
  const nr=$('#newRecipe'); if(nr) nr.onclick=()=>openComposer(null,'recipe');
  document.querySelectorAll('[data-ff]').forEach(b=>b.onclick=()=>{ S.feedFilter=b.dataset.ff; render(); });
  document.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>toggleLike(b.dataset.like));
  document.querySelectorAll('[data-precipe]').forEach(b=>b.onclick=()=>{ const p=S.feed.find(x=>x.id===b.dataset.precipe); if(p&&p.recipe){ const rec=normalize(JSON.parse(JSON.stringify(p.recipe))); openRecipe(rec,null); prepareMedia(rec); } });
  document.querySelectorAll('[data-psave]').forEach(b=>b.onclick=async()=>{ const p=S.feed.find(x=>x.id===b.dataset.psave); if(!p) return;
    const {data,error}=await sb.from('recipes').insert({recipe:p.recipe, reel_code:reelCode(p.recipe.source&&p.recipe.source.link)}).select('id').single();
    if (error){ toast('저장하지 못했어요'); return; } S.my.unshift({id:data.id, recipe:p.recipe, savedAt:Date.now()}); toast('내 레시피에 저장했어요'); });
  document.querySelectorAll('[data-pdel]').forEach(b=>b.onclick=()=>confirmBox('이 글을 삭제할까요?', async()=>{
    const p=S.feed.find(x=>x.id===b.dataset.pdel); const {error}=await sb.from('posts').delete().eq('id',p.id);
    if (error){ toast('삭제하지 못했어요'); return; }
    if (p.photo_path) sb.storage.from('photos').remove([p.photo_path]).catch(()=>{});
    S.feed=S.feed.filter(x=>x.id!==p.id); render(); toast('삭제했어요'); }));
}
let likeBusy=false;
async function toggleLike(id){
  if (likeBusy) return; likeBusy=true;
  const p=S.feed.find(x=>x.id===id), was=S.liked.has(id);
  was?S.liked.delete(id):S.liked.add(id); p.likeCount+=was?-1:1; render();
  const {error} = was ? await sb.from('likes').delete().eq('post_id',id).eq('user_id',S.user.id) : await sb.from('likes').insert({post_id:id});
  if (error){ was?S.liked.add(id):S.liked.delete(id); p.likeCount+=was?1:-1; render(); toast('하트를 누르지 못했어요'); }
  likeBusy=false;
}

/* ---------- 글쓰기 (레시피 공유 / 요리 인증) ---------- */
let comp={};
function openComposer(recipe, kind='cook', fromCook=false){
  if (!sb){ toast('서버 설정이 필요해요'); return; }
  if (!S.user){ $('#layer').innerHTML=`<div class="modal"><div class="sheet"><h3>${fromCook?'다 만들었네요. 올려 볼까요':'공유하기'}</h3><p class="muted" style="margin-top:6px">피드에 올리려면 로그인이 필요해요.</p><div style="margin-top:14px">${gbtn()}</div><button class="btn ghost" style="width:100%;margin-top:10px" id="cc">닫기</button></div></div>`; bindLogin(); $('#cc').onclick=()=>$('#layer').innerHTML=''; return; }
  comp={kind, blob:null, url:null, taste:0, recipe:recipe||null, fromCook, title:recipe?recipe.title:'', body:'', sel: recipe?'__cur':''};
  drawComposer();
}
function drawComposer(){
  const cook=comp.kind==='cook';
  const opts=S.my.map(d=>`<option value="${esc(d.id)}">${esc(d.recipe&&d.recipe.title)}</option>`).join('');
  $('#layer').innerHTML=`<div class="modal"><div class="sheet">
    <div class="row" style="justify-content:space-between"><h3>${comp.fromCook?'다 만들었네요. 올려 볼까요':'피드에 올리기'}</h3><button class="x" id="cc" aria-label="닫기">${IC.x}</button></div>
    <div class="tabs2"><button data-kind="recipe" class="${cook?'':'on'}">레시피만 공유</button><button data-kind="cook" class="${cook?'on':''}">요리 인증</button></div>
    ${cook?`<label class="fl">완성 사진 (필수)</label>
      ${comp.url?`<img src="${comp.url}" alt="" style="width:100%;border-radius:8px;max-height:340px;object-fit:cover"><button class="btn link" id="chgP" style="margin-top:8px">사진 바꾸기</button>`:`<label class="drop" for="pIn">${IC.camera}사진 찍기 또는 고르기</label>`}
      <input type="file" id="pIn" accept="image/*" class="hidden">`:''}
    <label class="fl">${cook?'만든 레시피 (선택)':'공유할 레시피'}</label>
    <select id="rs" style="width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:var(--paper)">
      ${comp.recipe?`<option value="__cur">${esc(comp.recipe.title)}</option>`:''}<option value="">${cook?'레시피 없이 올리기':'— 골라 주세요 —'}</option>${opts}</select>
    <label class="fl">제목</label><input type="text" id="pt" maxlength="60" value="${esc(comp.title)}" placeholder="${cook?'예: 처음 해본 대패숙주볶음':'예: 자취생 10분 레시피'}">
    ${cook?`<label class="fl">맛 셀프 평가</label><div class="starpick row" style="gap:0">${[1,2,3,4,5].map(n=>`<button data-st="${n}" class="${comp.taste>=n?'on':''}">★</button>`).join('')}</div>`:''}
    <label class="fl">한마디</label><textarea id="px" style="min-height:80px" maxlength="500" placeholder="${cook?'간장을 조금 줄였더니 딱 맞았어요':'재료가 적어서 자취방에서 하기 좋아요'}">${esc(comp.body)}</textarea>
    <p class="guard">${IC.shield}<span>사진과 글은 자동으로 검토돼요. 부적절한 사진은 모자이크 처리되고, 부적절한 글은 올라가지 않아요.</span></p>
    <div style="margin-top:14px"><button class="btn pri" id="pg">올리기</button></div><div id="perr"></div></div></div>`;
  $('#rs').value=comp.sel;
  const keep=()=>{ comp.title=$('#pt').value; comp.body=$('#px').value; comp.sel=$('#rs').value; };
  $('#cc').onclick=()=>{ $('#layer').innerHTML=''; };
  document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{ keep(); comp.kind=b.dataset.kind; drawComposer(); });
  const pin=$('#pIn'); if(pin) pin.onchange=async e=>{ const f=e.target.files[0]; if(!f) return; keep(); comp.blob=await shrink(f,1280,0.85); if(comp.url) URL.revokeObjectURL(comp.url); comp.url=URL.createObjectURL(comp.blob); drawComposer(); };
  const cp=$('#chgP'); if(cp) cp.onclick=()=>$('#pIn').click();
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{ comp.taste=+b.dataset.st; document.querySelectorAll('[data-st]').forEach(x=>x.classList.toggle('on', +x.dataset.st<=comp.taste)); });
  $('#rs').onchange=()=>{ const v=$('#rs').value; if(!$('#pt').value.trim()){ const d=v==='__cur'?comp.recipe:(S.my.find(x=>x.id===v)||{}).recipe; if(d) $('#pt').value=d.title; } };
  $('#pg').onclick=submitPost;
}
function publicRecipe(rec){ const r=JSON.parse(JSON.stringify(rec)); delete r.cover; const l=r.source&&r.source.link; r.source=l?{link:l}:{}; return r; }
async function submitPost(){
  const btn=$('#pg'), title=$('#pt').value.trim(), cook=comp.kind==='cook', err=m=>{ $('#perr').innerHTML=`<div class="err">${esc(m)}</div>`; };
  const sel=$('#rs').value; let recipe=null;
  if (sel==='__cur') recipe=comp.recipe; else if (sel){ const d=S.my.find(x=>x.id===sel); recipe=d?d.recipe:null; }
  if (cook && !comp.blob) return err('완성 사진을 넣어 주세요.');
  if (!cook && !recipe) return err('공유할 레시피를 골라 주세요.');
  if (!title) return err('제목을 적어 주세요.');
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> 검토하고 올리는 중';
  try{
    const body={kind:comp.kind, title, body:$('#px').value.trim(), taste:comp.taste||0, recipe: recipe?publicRecipe(recipe):null};
    if (cook){ body.photo=await blobToB64(comp.blob); body.mosaic=await blobToB64(await mosaicOf(comp.blob)); }
    const {r,data}=await authApi('/api/post', body);
    if (!r.ok) throw new Error((MOD_ERR[data.error]||('올리지 못했어요 ('+(data.error||r.status)+')'))+(data.reason?` (${data.reason})`:'')+(data.detail?` — 원인: ${data.detail}`:''));
    $('#layer').innerHTML=''; stopAllTimers(); clearMedia(); S.recipe=null; S.tab='feed'; S.feedFilter='all'; S.feed=null; render();
    toast(data.flagged ? '사진이 부적절하다고 판단되어 모자이크 처리해서 올렸어요' : '피드에 올렸어요');
  }catch(e){ btn.disabled=false; btn.textContent='다시 올리기'; err(e.message||'올리지 못했어요'); }
}

/* ---------- 설정 ---------- */
$('#setBtn').onclick=()=>{
  const opt=(name,cur,list)=>`<div class="opt">${list.map(([v,l])=>`<button data-${name}="${v}" class="${cur===v?'on':''}">${l}</button>`).join('')}</div>`;
  const pf=S.profile||{};
  const acct = !sb ? '' : S.user ? `<label class="fl">계정</label><div class="row">${avatarHTML(pf.name, pf.avatar)}<div style="flex:1;min-width:0"><b>${esc(pf.name||'')}</b><div class="muted" style="font-size:.8rem">${esc(S.user.email||'')}</div></div><button class="btn ghost sm" id="editPf">프로필 편집</button></div><button class="btn ghost sm" id="logout" style="margin-top:8px">로그아웃</button>` : `<label class="fl">계정</label>${gbtn()}`;
  $('#layer').innerHTML=`<div class="modal"><div class="sheet"><div class="row" style="justify-content:space-between"><h3>설정</h3><button class="x" id="pwx" aria-label="닫기">${IC.x}</button></div>${acct}
    <label class="fl">화면</label>${opt('th',S.theme,[['base','기본'],['bright','밝게'],['dark','다크'],['auto','자동']])}
    <label class="fl">글자 크기</label>${opt('fs',S.fs,[['m','보통'],['l','크게'],['xl','아주 크게']])}
    <label class="fl">분량 표시</label>${opt('un',S.unit,[['orig','영상 속 단위'],['precise','그램·밀리리터']])}

/* ================= 약관 동의 =================

const TERMS_VERSION='2026-11-12';
const TERMS_CHANGES='레시피를 찾는 방식(화면 자막·음성·댓글 판별, 여러 레시피 정리)과 AI 사용량 기록 내용을 더했어요.';   // 바뀐 약관을 다시 동의받을 때 화면에 보여 줄 한 줄 요약
let legalDoc=null;
async function loadLegal(){
  if (legalDoc) return legalDoc;
  const html=await (await fetch('/legal.html',{cache:'no-cache'})).text();
  legalDoc=new DOMParser().parseFromString(html,'text/html'); return legalDoc;
}
async function showDoc(id){

  box.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="row" style="justify-content:flex-end"><button class="x" aria-label="닫기">${IC.x}</button></div><div class="doc">불러오는 중…</div><button class="btn pri" style="margin-top:20px">확인</button></div>`;

  catch(e){ box.querySelector('.doc').innerHTML='문서를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'; }
}
function consented(){ const c=LS.get('rc_consent',null); return !!(c && c.version===TERMS_VERSION); }
let afterConsent=[];
function whenConsented(fn){ if (consented()) fn(); else afterConsent.push(fn); }

      ${item('privacy','개인정보 수집·이용','privacy',`<table class="sumtbl"><tr><th>항목</th><th>목적</th><th>보관</th></tr>
        <tr><td>구글 계정 이메일·이름, 닉네임, 프로필 사진</td><td>로그인, 피드 작성자 표시</td><td>탈퇴할 때까지</td></tr>
        <tr><td>게시물, 저장한 레시피</td><td>피드, 레시피 보관</td><td>삭제·탈퇴할 때까지</td></tr>
        <tr><td>릴스 링크, 공개 캡션·댓글, 넣은 글·사진·영상</td><td>레시피 분석</td><td>분석 후 바로 폐기</td></tr></table>
        <span style="display:block;font-size:.8rem;color:var(--sub);margin-top:6px">계정과 저장 데이터는 Supabase 서울 서버에 보관해요. 분석과 앱 운영을 위해 Google(미국), Vercel(미국), Apify(체코)로 정보가 옮겨져요. 동의하지 않을 수 있지만, 그러면 앱을 쓸 수 없어요.</span>`)}
    </div>
    <p class="muted" style="font-size:.8rem;margin-top:14px">동의는 설정의 "동의 철회 및 데이터 삭제"로 언제든 철회할 수 있어요.</p>
    <button class="btn pri" id="agGo" disabled style="margin-top:18px;min-height:56px">동의하고 시작</button>

  const boxes=[...g.querySelectorAll('[data-agree]')], all=$('#agAll'), go=$('#agGo');
  const sync=()=>{ const ok=boxes.every(b=>b.checked); all.checked=ok; go.disabled=!ok; };
  boxes.forEach(b=>b.onchange=sync); all.onchange=()=>{ boxes.forEach(b=>b.checked=all.checked); sync(); };
  g.querySelectorAll('[data-doc]').forEach(b=>b.onclick=e=>{ e.preventDefault(); e.stopPropagation(); showDoc(b.dataset.doc); });
  go.onclick=()=>{
    LS.set('rc_consent',{version:TERMS_VERSION, at:new Date().toISOString(), items:['age','terms','privacy']});
    g.classList.add('hidden'); g.innerHTML=''; document.body.style.overflow='';
    syncConsent(); const q=afterConsent; afterConsent=[]; q.forEach(f=>{ try{ f(); }catch(e){} });

}
// 로그인한 회원은 서버에도 동의 기록을 남긴다 (증빙)
async function syncConsent(){
  if (!sb || !S.user) return; const c=LS.get('rc_consent',null); if (!c || c.version!==TERMS_VERSION) return;
  const key='rc_consent_sync_'+S.user.id; if (LS.get(key,'')===c.version) return;

// 동의 철회: 회원이면 계정과 서버 데이터 삭제, 이 기기의 데이터도 모두 삭제
function withdraw(){
  const member=!!(sb&&S.user);
  confirmBox(member?'탈퇴하고 모든 데이터를 삭제할까요? 계정, 프로필, 저장한 레시피, 올린 글과 사진이 지워지고 되돌릴 수 없어요.':'이 폰에 저장된 레시피와 설정을 모두 지우고 동의를 철회할까요? 되돌릴 수 없어요.', async()=>{
    try{
      if (member){ const {r,data}=await authApi('/api/account',{action:'delete', confirm:'탈퇴'}); if(!r.ok) throw new Error(data.detail||data.error||r.status); try{ await sb.auth.signOut(); }catch(e){} }
      try{ localStorage.clear(); }catch(e){}
      try{ indexedDB.deleteDatabase('reelcook'); }catch(e){}
      location.replace('/');
    }catch(e){ toast('삭제하지 못했어요: '+(e.message||e)); }
  }, member?'탈퇴':'삭제');
}

/* ---------- AI 사용량 ---------- */
async function showUsage(){
  const box=document.createElement('div'); box.className='modal'; box.style.zIndex=70;
  box.innerHTML=`<div class="sheet"><div class="row" style="justify-content:space-between"><h3>오늘 AI 사용량</h3><button class="x" aria-label="닫기">${IC.x}</button></div><div id="ub" class="muted" style="margin-top:12px">불러오는 중…</div></div>`;
  document.body.appendChild(box); box.querySelector('.x').onclick=()=>box.remove();
  const ub=box.querySelector('#ub');
  try{
    const r=await fetch('/api/usage',{headers:S.pass?{'x-app-passcode':S.pass}:{}}); const d=await r.json();
    if (!r.ok) throw new Error(d.error==='passcode'?'앱 비밀번호가 맞지 않아요.':'불러오지 못했어요.');
    const byM=Object.fromEntries((d.rows||[]).map(x=>[x.model,x])), short=m=>m.replace(/^gemini-/,'');
    const cache=byM.cache;
    const rows=d.models.map(m=>{ const x=byM[m]||{calls:0,ok:0,busy:0,limited:0,tin:0,tout:0};
      return `<tr class="${x.exhausted?'ex':''}"><td>${esc(short(m))}${x.exhausted?' (오늘 소진)':''}</td><td>${x.calls}</td><td>${x.ok}</td><td>${x.busy}</td><td>${x.limited}</td><td>${Math.round(((x.tin||0)+(x.tout||0))/1000)}k</td></tr>`; }).join('');
    const real=(d.rows||[]).filter(x=>x.model!=='cache'), total=real.reduce((a,x)=>a+x.ok,0), tok=real.reduce((a,x)=>a+(x.tin||0)+(x.tout||0),0), avg=total?Math.round(tok/total/1000):0;
    ub.className=''; ub.innerHTML=`
      <p style="font-size:.95rem">오늘 성공한 AI 요청 <b>${total}회</b>${avg?`, 한 번에 평균 <b>${avg}k 토큰</b>`:''}${cache?`, 저장된 분석으로 바로 보여준 것 <b>${cache.calls}회</b>(무료 사용량 안 씀)`:''}</p>
      <table class="usage"><tr><th>모델</th><th>요청</th><th>성공</th><th>붐빔</th><th>한도</th><th>토큰</th></tr>${rows}</table>
      <p class="muted" style="font-size:.8rem;margin-top:12px">무료 한도는 모델마다 따로 있어서, 한 모델이 붐비거나 한도가 차면 아래 모델로 자동으로 넘어가요. 하루 한도는 ${kst(d.resetAt)}에 다시 채워져요.</p>
      <p class="muted" style="font-size:.8rem;margin-top:6px">Google은 정확한 무료 한도 숫자를 API로 알려주지 않아요. 모델별 한도와 남은 양은 AI Studio에서 볼 수 있어요.</p>
      ${d.tracking&&!(d.rows||[]).length?'<div class="note" style="margin-top:10px">아직 기록이 없어요. Supabase에서 update-v1.3.sql을 실행했는지 확인해 주세요.</div>':''}
      <a class="btn ghost" style="width:100%;margin-top:14px;text-decoration:none" href="${esc(d.studio)}" target="_blank" rel="noopener">AI Studio에서 한도 보기</a>`;
  }catch(e){ ub.textContent=e.message||'불러오지 못했어요.'; }
}

/* ---------- 전체 화면 영상 가이드 ----------
   세로 릴스를 화면 가득. 아래에 지금 단계 안내가 겹쳐 뜨고, 영상이 흘러가면 단계도 따라 바뀐다(실시간 가이드).
   가로로 돌리면 왼쪽 영상, 오른쪽 안내. */
const PL={i:0, loop:false, guide:true, v:null, follow:true};
function videoSrc(){ const m=S.media; return m && m.url ? m.url : null; }
const mediaLoading=()=>!!(S.media && S.media.status==='loading');
function firstClip(){ const k=S.recipe.steps.findIndex(st=>st.clip); return k<0?0:k; }
// 실시간 따라가기용 시간표: 단계 순서대로 장면 시작 시각이 늘어나는 것만 쓴다.
// (AI가 적은 시각이 거꾸로이거나 겹치면 그 단계는 자동 전환에서 빼서 1-2-4-3처럼 왔다 갔다 하지 않게)
function timeline(){ const out=[]; let last=-1; S.recipe.steps.forEach((x,i)=>{ if (x.clip && x.clip.start>=last+0.5){ out.push({i, start:x.clip.start}); last=x.clip.start; } }); return out; }
// t초에 해당하는 단계: 시작 시각이 지난 마지막 단계. 첫 장면 전(오프닝)이면 -1
function stepAt(t){ let k=-1; for (const e of PL.tl) { if (e.start-0.3<=t) k=e.i; else break; } return k; }
function openPlayer(i){
  const src=videoSrc(); if (!src && !mediaLoading()){ toast('이 레시피에는 볼 수 있는 영상이 없어요'); return; }
  closePlayer(true);
  if (playing) stopScene(playing);
  PL.i=Math.max(0, i|0); PL.loop=false; PL.guide=true; PL.tl=timeline(); PL.opening=false; PL.hold=null;
  const el=document.createElement('div'); el.id='player'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','영상 가이드');
  el.innerHTML=`<video playsinline preload="auto"></video>
    <div class="pl-top"><button id="plx" aria-label="닫기">${IC.x}</button><span id="plc"></span><button id="plm" aria-label="소리 끄기">${IC.sound}</button></div>
    <button class="pl-tap" id="pltap" aria-label="재생/일시정지"></button>
    <div class="pl-guide" id="plg"></div>`;
  document.body.appendChild(el); document.body.style.overflow='hidden';
  const v=el.querySelector('video'); PL.v=v; v.muted=false;
  // 영상은 분석하는 동안 미리 받기 시작한다. 아직 받는 중이면 진행률을 보여 주고 끝나면 바로 재생
  if (src) v.src=src; else waitMedia();
  v.addEventListener('error',()=>{ $('#plc').textContent='영상을 재생하지 못했어요'; });
  const startAt=()=>{ const st=S.recipe.steps[PL.i]; return st&&st.clip ? Math.max(0, st.clip.start-0.3) : st&&st.photo!=null ? Math.max(0, st.photo-2) : 0; };
  v.addEventListener('loadedmetadata',()=>{ v.currentTime=startAt(); v.play().catch(()=>{ v.muted=true; syncMute(); v.play().catch(()=>{}); }); },{once:true});
  v.addEventListener('timeupdate',()=>{
    const st=S.recipe.steps[PL.i], t=v.currentTime;
    if (PL.loop && st && st.clip){ if (t>st.clip.end+0.5 || t<st.clip.start-1) v.currentTime=Math.max(0,st.clip.start-0.3); return; }
    // 직접 고른 단계는 그 장면이 끝날 때까지 자동 전환하지 않는다
    if (PL.hold){ if (t>=PL.hold.a-1 && t<=PL.hold.b+0.5) return; PL.hold=null; }
    const k=stepAt(t);
    if (k<0){ const first=PL.tl.length?PL.tl[0].i:0; if (!PL.opening || PL.i!==first){ PL.opening=true; PL.i=first; drawGuide(); } return; }
    if (PL.opening || k!==PL.i){ PL.opening=false; PL.i=k; drawGuide(); }
  });
  // 끝까지 보면: 반복 모드는 그 단계 처음으로, 아니면 1단계 장면에서 멈춤
  v.addEventListener('ended',()=>{ const st=S.recipe.steps[PL.i];
    if (PL.loop && st && st.clip){ v.currentTime=Math.max(0,st.clip.start-0.3); v.play().catch(()=>{}); return; }
    const first=PL.tl.length?PL.tl[0]:null; PL.opening=false; PL.hold=null; PL.i=first?first.i:0; v.currentTime=first?Math.max(0,first.start-0.3):0; drawGuide(); });
  v.addEventListener('play',()=>el.classList.remove('paused')); v.addEventListener('pause',()=>el.classList.add('paused'));
  $('#plx').onclick=()=>closePlayer();
  $('#plm').onclick=()=>{ v.muted=!v.muted; syncMute(); };
  $('#pltap').onclick=()=>{ if (v.paused) v.play().catch(()=>{}); else v.pause(); };
  { const x=S.recipe.steps[PL.i]; PL.hold = x && x.clip ? {a:x.clip.start, b:x.clip.end} : null; }
  setAwake(true); drawGuide();
  function waitMedia(){ const iv=setInterval(()=>{ if (!document.getElementById('player')){ clearInterval(iv); return; }
    if (S.media && S.media.status==='none'){ clearInterval(iv); $('#plc').textContent='영상을 받지 못했어요'; return; }
    if (S.media && S.media.url){ clearInterval(iv); v.src=S.media.url; drawGuide(); v.addEventListener('loadedmetadata',()=>{ v.currentTime=startAt(); v.play().catch(()=>{}); },{once:true}); }
    else if (S.media) $('#plc').textContent=`영상 받는 중 ${Math.round((S.media.pct||0)*100)}%`; },500); }
}
function syncMute(){ const b=$('#plm'); if(!b||!PL.v) return; b.innerHTML=PL.v.muted?IC.mute:IC.sound; b.setAttribute('aria-label',PL.v.muted?'소리 켜기':'소리 끄기'); }
function gotoStep(i){ const st=S.recipe.steps, v=PL.v; if (i<0||i>=st.length) return; PL.i=i; PL.opening=false;
  const x=st[i]; PL.hold = x.clip ? {a:x.clip.start, b:x.clip.end} : null; drawGuide();
  if (v && (x.clip||x.photo!=null)){ v.currentTime=Math.max(0, x.clip?x.clip.start-0.3:x.photo-2); v.play().catch(()=>{}); } }
function drawGuide(){
  const g=$('#plg'); if(!g) return; const r=S.recipe, n=r.steps.length, i=PL.i, s=r.steps[i];
  $('#plc').textContent=PL.opening?'오프닝':`${i+1} / ${n}단계`;
  g.className='pl-guide'+(PL.guide?'':' min');
  g.innerHTML=`<button class="pl-handle" id="plh" aria-label="${PL.guide?'안내 접기':'안내 펴기'}"><i></i></button>
    <div class="pl-sn"><span class="disp">${i+1}</span>${PL.opening?'<span class="pl-soon">곧 시작</span>':''}${heatHTML(s.heat)}${s.clip?'':'<span class="muted" style="color:#C9B8AC">영상에 없는 단계</span>'}</div>
    <div class="pl-st">${stepHTML(s.text)}</div>
    ${PL.guide&&s.cue?`<div class="cue"><span>${esc(s.cue)}</span></div>`:''}
    ${PL.guide&&s.tip?`<div class="tip"><span>${esc(s.tip)}</span></div>`:''}
    ${s.seconds>0?`<div class="timer" data-timer="${i}">${IC.clock}<span class="tm">${mmss(s.seconds)}</span><button data-tstart="${i}">시작</button></div>`:''}
    <div class="pl-nav"><button class="btn prev" id="plp" ${i===0?'disabled':''}>이전</button>
      <button class="btn ${PL.loop?'on':''}" id="pll" aria-pressed="${PL.loop}">${PL.loop?'반복 중':'이 단계 반복'}</button>
      <button class="btn pri" id="pln" ${i===n-1?'disabled':''}>다음</button></div>`;
  $('#plh').onclick=()=>{ PL.guide=!PL.guide; drawGuide(); };
  $('#plp').onclick=()=>gotoStep(PL.i-1); $('#pln').onclick=()=>gotoStep(PL.i+1);
  $('#pll').onclick=()=>{ PL.loop=!PL.loop; if (PL.loop) gotoStep(PL.i); else drawGuide(); };
  g.querySelectorAll('[data-tstart]').forEach(b=>b.onclick=()=>toggleTimer(+b.dataset.tstart)); refreshTimerUI();
}
function closePlayer(silent){ const el=document.getElementById('player'); if(!el) return;
  const v=el.querySelector('video'); if(v){ v.pause(); v.removeAttribute('src'); v.load(); }
  const i=PL.i; el.remove(); PL.v=null; document.body.style.overflow='';
  if (!silent && S.cooking && i!==cookIdx){ cookIdx=i; drawCook(); }
  setAwake(S.busy || !!S.recipe || S.cooking); }

/* ---------- 안드로이드 뒤로가기: 앱 안에서 한 단계씩 ----------
   방법: 히스토리에 "가드" 한 칸을 깔아 두고, 뒤로가기가 오면 앱 화면을 한 단계 되돌린 뒤 가드를 다시 깐다.
   첫 화면에서는 "한 번 더 누르면 종료" 안내 후 2초 안에 다시 누르면 종료. */
let backAt=0, guardTimer=null;
function pushGuard(){ if (!history.state || !history.state.rcGuard) history.pushState({rcGuard:1}, ''); }
function handleBack(){
  if (document.getElementById('player')){ closePlayer(); return true; }
  const top=[...document.querySelectorAll('body > .modal')].pop();       // 약관 보기·AI 사용량 창
  if (top){ top.remove(); return true; }
  if (!$('#gate').classList.contains('hidden')) return false;            // 동의 화면에서는 종료 안내
  if (S.cooking){ closeCook(); return true; }
  if ($('#layer').innerHTML.trim()){ $('#layer').innerHTML=''; if(!S.recipe) render(); return true; }  // 설정·공유·확인 창
  if (S.recipe){ stopAllTimers(); clearMedia(); S.recipe=null; render(); window.scrollTo(0,0); return true; }
  const open=document.querySelector('#app details[open]'); if (open){ open.open=false; return true; }
  if (S.tab!=='import' && !S.busy){ S.tab='import'; render(); window.scrollTo(0,0); return true; }
  return false;
}
window.addEventListener('popstate', ()=>{
  if (handleBack()){ pushGuard(); return; }
  const now=Date.now();
  if (now-backAt<2000) return;                       // 2초 안에 두 번째 → 그대로 종료
  backAt=now; toast(S.busy?'분석 중이에요. 뒤로 버튼을 한 번 더 누르면 앱이 닫혀요':'뒤로 버튼을 한 번 더 누르면 앱이 닫혀요');
  clearTimeout(guardTimer); guardTimer=setTimeout(pushGuard, 2000);
});

/* ---------- 보던 화면 이어서 열기 ----------
   안드로이드는 앱이 뒤에 있을 때 메모리를 위해 앱을 끌 수 있다 → 나갈 때 화면을 적어 두고, 다시 켜면 그대로 연다 */
function saveResume(){
  try{
    const snap={at:Date.now(), tab:S.tab};
    if (S.recipe){ Object.assign(snap,{recipe:S.recipe, savedId:S.recipeSavedId||null, set:S.recipeSet||null, setIdx:S.setIdx||0, setSaved:S.setSaved||{},
      servings:S.servings, rtab:S.rtab, unit:S.unit, cooking:!!S.cooking, cookIdx, have:S.have||{}, y:window.scrollY}); }
    localStorage.setItem('rc_resume', JSON.stringify(snap));
  }catch(e){ try{ localStorage.setItem('rc_resume', JSON.stringify({at:Date.now(), tab:S.tab})); }catch(_){} }
}
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='hidden') saveResume(); });
window.addEventListener('pagehide', saveResume);
function resumeLast(){
  const r=LS.get('rc_resume',null); if (!r || Date.now()-r.at > 12*3600e3) return;
  if (r.tab && r.tab!=='import') { S.tab=r.tab; }
  if (r.recipe){
    const set=r.set? r.set.map(x=>normalize(x)) : null, rec=set? set[r.setIdx||0] : normalize(r.recipe);
    openRecipe(rec, r.savedId||null, set);
    if (set){ S.setIdx=r.setIdx||0; S.setSaved=r.setSaved||{}; }
    S.servings=r.servings||rec.servings; S.rtab=r.rtab||'ing'; S.have=r.have||{}; render();
    if (r.savedId) restoreMedia(rec, r.savedId); else prepareMedia(rec);
    if (r.cooking) openCook(Math.min(r.cookIdx||0, rec.steps.length-1));
    else if (r.y) setTimeout(()=>window.scrollTo(0,r.y), 50);
  } else if (r.tab && r.tab!=='import') render();
}

/* ================= 시작 ================= */
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{ if(S.busy&&b.dataset.tab!=='import'){ toast('분석이 끝나면 이동할 수 있어요'); return; } stopAllTimers(); S.recipe=null; S.tab=b.dataset.tab; window.scrollTo(0,0); render(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
render();
if (!consented()) showGate();
pushGuard();
if (new URLSearchParams(location.search).has('share')) whenConsented(readShareInbox);
else whenConsented(resumeLast);
initCloud();
</script>
